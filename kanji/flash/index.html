<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kanji Flashcards</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;background:#e9e6dc;color:#2c2a26;
    display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;}
  .jp{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Hiragino Sans",sans-serif;}
  .mincho{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;}
  header{background:#1f3a5f;color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;flex:none;}
  .hrow{display:flex;align-items:center;gap:10px;}
  .hback{display:inline-flex;align-items:center;justify-content:center;min-width:54px;min-height:54px;
    margin-right:2px;font-size:34px;line-height:1;color:#fff;text-decoration:none;border-radius:14px;
    background:rgba(255,255,255,.14);flex:0 0 auto;}
  .hrow h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.5px;flex:1;}
  select{font-size:15px;padding:7px 8px;border-radius:9px;border:none;background:#fff;max-width:46%;}
  .tabs{display:flex;gap:8px;margin-top:10px;}
  .tab{flex:1;text-align:center;padding:9px 0;border-radius:10px;background:#33507a;color:#cdd7e6;
    font-size:15px;font-weight:600;cursor:pointer;border:none;}
  .tab.on{background:#fff;color:#1f3a5f;}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;min-height:0;}
  .card{width:100%;max-width:440px;height:100%;max-height:620px;background:#fffdf7;border:1px solid #d9d3c2;
    border-radius:20px;box-shadow:0 8px 26px rgba(0,0,0,.16);display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:18px;position:relative;overflow:hidden;cursor:pointer;user-select:none;}
  .pic{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;min-height:0;}
  .pic svg{width:56%;max-width:230px;height:auto;max-height:30vh;}
  .kbig{font-size:96px;line-height:1.05;margin-top:10px;text-align:center;}
  .secbadge{position:absolute;top:12px;left:14px;font-size:12px;color:#b3aa92;font-style:italic;}
  .flliphint{position:absolute;bottom:10px;font-size:12px;color:#c3bba6;letter-spacing:.5px;}
  /* BACK */
  .back{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%;flex:1;min-height:0;}
  .card.flipped .pic{display:none;}
  .card.flipped .back{display:flex;}
  .bkanji{font-size:76px;line-height:1;}
  .bdef{font-size:28px;margin-top:10px;font-weight:600;padding:0 6px;}
  .reads{margin-top:16px;display:flex;flex-direction:column;gap:7px;align-items:center;}
  .rrow{display:flex;align-items:baseline;gap:9px;}
  .rlbl{color:#b08d2a;font-size:20px;font-weight:700;}
  .rkana{font-size:25px;font-weight:700;}
  .rro{color:#c0392b;font-style:italic;font-size:17px;}
  .say{color:#9a8f76;font-style:italic;font-size:16px;margin-top:9px;}
  .speak{margin-top:10px;width:52px;height:52px;border-radius:50%;border:none;background:#f0ece0;font-size:24px;cursor:pointer;}
  .bex{margin-top:14px;padding-top:12px;border-top:1px dashed #ddd4bf;width:90%;}
  .bex .jp2{font-size:26px;line-height:1.3;}
  .bex .ro{font-style:italic;color:#8a8472;font-size:16px;margin-top:4px;}
  .bex .en{font-size:18px;color:#4a463d;margin-top:5px;}
  .hl{color:#c0392b;font-weight:700;}
  /* NAV */
  .nav{display:flex;align-items:center;gap:16px;margin-top:12px;flex:none;padding-bottom:env(safe-area-inset-bottom);}
  .nav button{width:58px;height:58px;border-radius:50%;border:none;background:#1f3a5f;color:#fff;font-size:24px;cursor:pointer;}
  .counter{font-size:15px;color:#6b6557;min-width:88px;text-align:center;}
  /* QUIZ */
  .quizwrap{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;gap:10px;min-height:0;}
  .qtype{display:flex;gap:8px;flex:none;}
  .qtbtn{flex:1;padding:8px 0;border-radius:10px;border:1px solid #d9d3c2;background:#fffdf7;color:#6b6557;font-size:14px;font-weight:600;cursor:pointer;}
  .qtbtn.on{background:#1f3a5f;color:#fff;border-color:#1f3a5f;}
  .qcard{flex:1;min-height:0;background:#fffdf7;border:1px solid #d9d3c2;border-radius:18px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:12px;box-shadow:0 6px 18px rgba(0,0,0,.12);}
  .qcard svg{width:34%;max-width:150px;height:auto;max-height:20vh;}
  .qkanji{font-size:72px;line-height:1;margin-top:6px;}
  .qprompt{font-size:14px;color:#9a8f76;font-style:italic;margin-top:8px;}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:none;}
  .opt{min-height:58px;padding:8px;border-radius:13px;border:1px solid #d9d3c2;background:#fffdf7;font-size:16.5px;font-weight:600;cursor:pointer;line-height:1.25;}
  .opt.correct{background:#e6f2df;border-color:#4f8a3d;color:#2d5a20;}
  .opt.wrong{background:#fbe9e6;border-color:#c0392b;color:#96271b;}
  .qbar{display:flex;align-items:center;justify-content:space-between;flex:none;padding-bottom:env(safe-area-inset-bottom);}
  .score{font-size:15px;color:#6b6557;}
  .qnext{padding:12px 26px;border-radius:12px;border:none;background:#1f3a5f;color:#fff;font-size:16px;font-weight:600;cursor:pointer;}
  .qnext:disabled{opacity:.4;}
</style>
</head>

</header>

\"94\" y=\"118\" width=\"112\" height=\"50\" rx=\"8\" fill=\"#fffdf7\" stroke=\"#2c2a26\" stroke-width=\"6\"/><rect x=\"112\" y=\"132\" width=\"76\" height=\"9\" rx=\"4\" fill=\"#2c2a26\"/><rect x=\"112\" y=\"149\" width=\"52\" height=\"9\" rx=\"4\" fill=\"#cfc7b2\"/></svg>"},{"g":6,"k":"朗","en":"cheerful, bright","feat":"ほがらか","fro":"ho ga ra ka","say":"hoh-gah-rah-kah","kun":"ほが(らか)","kro":"hoga(raka)","on":"ロウ","oro":"rou","exjp":"<span class=\"hl\">朗</span>らかだ","exro":"hogaraka da","exen":"cheerful, sunny","svg":"<svg viewBox=\"0 0 300 300\" xmlns=\"http://www.w3.org/2000/svg\"> <path d=\"M150 42V18M216 74l18-18M244 138h24M84 74 66 56M56 138H32\" stroke=\"#c9a227\" stroke-width=\"9\" stroke-linecap=\"round\"/> <circle cx=\"150\" cy=\"132\" r=\"62\" fill=\"#f0d469\" stroke=\"#2c2a26\" stroke-width=\"6\"/> <path d=\"M128 118v9M172 118v9\" stroke=\"#2c2a26\" stroke-width=\"8\" stroke-linecap=\"round\"/> <path d=\"M122 148q28 26 56 0\" fill=\"none\" stroke=\"#2c2a26\" stroke-width=\"7\" stroke-linecap=\"round\"/> <path d=\"M176 256H276A24 24 0 0 0 278 214A28 28 0 0 0 228 198A24 24 0 0 0 186 212A24 24 0 0 0 176 256Z\" fill=\"#7fb0c8\" stroke=\"#2c2a26\" stroke-width=\"6\" stroke-linejoin=\"round\"/> <path d=\"M56 252H188A30 30 0 0 0 190 198A36 36 0 0 0 128 178A32 32 0 0 0 72 196A32 32 0 0 0 56 252Z\" fill=\"#fffdf7\" stroke=\"#2c2a26\" stroke-width=\"6\" stroke-linejoin=\"round\"/> </svg>"},{"g":6,"k":"論","en":"argument, debate, theory","feat":"ろん","fro":"ron","say":"rohn","kun":"","kro":"","on":"ロン","oro":"ron","exjp":"議<span class=\"hl\">論</span>","exro":"giron","exen":"discussion, debate","svg":"<svg viewBox=\"0 0 300 300\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"20\" y=\"56\" width=\"152\" height=\"92\" rx=\"18\" fill=\"#5aa0c6\"/><polygon points=\"54,148 54,190 96,148\" fill=\"#5aa0c6\"/><rect x=\"46\" y=\"84\" width=\"100\" height=\"13\" rx=\"6\" fill=\"#fffdf7\"/><rect x=\"46\" y=\"110\" width=\"68\" height=\"13\" rx=\"6\" fill=\"#fffdf7\"/><rect x=\"128\" y=\"158\" width=\"152\" height=\"92\" rx=\"18\" fill=\"#e8c45a\"/><polygon points=\"246,158 246,116 204,158\" fill=\"#e8c45a\"/><rect x=\"154\" y=\"186\" width=\"100\" height=\"13\" rx=\"6\" fill=\"#2c2a26\"/><rect x=\"154\" y=\"212\" width=\"68\" height=\"13\" rx=\"6\" fill=\"#2c2a26\"/></svg>"}]</script>
<script>
const ALL = JSON.parse(document.getElementById('cards').textContent);
const main = document.getElementById('main');
const secSel = document.getElementById('sec');
let mode='browse', deck=[], pos=0, score=0, asked=0, quizType='english';

(function(){
  let o='<option value="0">All grades ('+ALL.length+')</option>';
  for(let g=1;g<=6;g++){const n=ALL.filter(c=>c.g===g).length;o+='<option value="'+g+'">Grade '+g+' ('+n+')</option>';}
  secSel.innerHTML=o;
})();

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pool(){const s=+secSel.value;return s===0?ALL.slice():ALL.filter(c=>c.g===s);}
function buildDeck(){deck=pool();if(mode==='shuffle'||mode==='quiz')shuffle(deck);pos=0;}

/* speech: rank real Japanese voices above Apple's novelty character voices */
let jaVoice=null;
function pickVoice(){
  if(!window.speechSynthesis)return;
  const bad=/(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley)/i;
  const vs=(speechSynthesis.getVoices()||[]).filter(v=>/^ja/i.test((v.lang||'').replace('_','-')));
  vs.sort((a,b)=>{
    const s=v=>(bad.test(v.name)?-100:0)+(/premium/i.test(v.name+v.voiceURI)?60:/enhanced/i.test(v.name+v.voiceURI)?45:0)+(/kyoko|otoya/i.test(v.name)?55:0);
    return s(b)-s(a);
  });
  jaVoice=vs[0]||null;
}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(t){
  if(!window.speechSynthesis||!t)return;
  try{speechSynthesis.cancel();setTimeout(()=>{const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.6;if(jaVoice)u.voice=jaVoice;speechSynthesis.speak(u);},180);}catch(e){}
}

function readsHTML(c){
  let h='';
  if(c.kun)h+='<div class="rrow"><span class="rlbl mincho">\u8a13</span><span class="rkana jp">'+c.kun+'</span><span class="rro">'+c.kro+'</span></div>';
  if(c.on)h+='<div class="rrow"><span class="rlbl mincho">\u97f3</span><span class="rkana jp">'+c.on+'</span><span class="rro">'+c.oro+'</span></div>';
  return h;
}

function render(){
  if(mode==='quiz'){renderQuiz();return;}
  const c=deck[pos];
  main.innerHTML=
    '<div class="card" id="cardEl">'+
      '<div class="secbadge">Grade '+c.g+'</div>'+
      '<div class="pic">'+c.svg+'<div class="kbig mincho">'+c.k+'</div></div>'+
      '<div class="back">'+
        '<div class="bkanji mincho">'+c.k+'</div>'+
        '<div class="bdef">'+c.en+'</div>'+
        '<div class="reads">'+readsHTML(c)+'</div>'+
        '<div class="say">say: \u201c'+c.say+'\u201d</div>'+
        '<button class="speak" id="spk">\ud83d\udd0a</button>'+
        (c.exjp?'<div class="bex"><div class="jp2 jp">'+c.exjp+'</div><div class="ro">'+c.exro+'</div><div class="en">'+c.exen+'</div></div>':'')+
      '</div>'+
      '<div class="flliphint">tap to flip</div>'+
    '</div>'+
    '<div class="nav">'+
      '<button id="prev">&#8249;</button>'+
      '<div class="counter">'+(pos+1)+' / '+deck.length+'</div>'+
      '<button id="next">&#8250;</button>'+
    '</div>';
  const card=document.getElementById('cardEl');
  document.getElementById('prev').onclick=e=>{e.stopPropagation();go(-1);};
  document.getElementById('next').onclick=e=>{e.stopPropagation();go(1);};
  document.getElementById('spk').onclick=e=>{e.stopPropagation();say(deck[pos].feat);};
  let sx=0,sy=0;
  card.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;});
  card.addEventListener('pointerup',e=>{
    if(e.target.id==='spk')return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){go(dx<0?1:-1);}
    else if(Math.abs(dx)<12&&Math.abs(dy)<12){card.classList.toggle('flipped');}
  });
}
function go(d){pos=(pos+d+deck.length)%deck.length;render();}

function renderQuiz(){
  if(asked>=deck.length){
    main.innerHTML='<div class="quizwrap" style="justify-content:center"><div class="qcard">'+
      '<div style="font-size:34px;font-weight:700">Quiz complete!</div>'+
      '<div class="bdef">You scored '+score+' / '+asked+'</div>'+
      '<button class="qnext" style="margin-top:18px" id="again">Play again</button></div></div>';
    document.getElementById('again').onclick=()=>{startQuiz();};
    return;
  }
  const c=deck[pos];
  const rom=(quizType==='romaji');
  const toggle='<div class="qtype">'+
    '<button class="qtbtn'+(quizType==='english'?' on':'')+'" data-qt="english">Meaning</button>'+
    '<button class="qtbtn'+(quizType==='romaji'?' on':'')+'" data-qt="romaji">Reading</button>'+
  '</div>';
  let others=pool().filter(x=> rom ? x.fro!==c.fro : x.en!==c.en);
  shuffle(others);
  let opts=[c,...others.slice(0,3)];
  shuffle(opts);
  const promptTxt = rom ? 'Tap the correct reading' : 'What does it mean?';
  const optsHTML=opts.map((o,i)=>{
    const label = rom ? (o.feat+' \u00b7 '+o.fro) : o.en;
    const ok=(rom?o.fro===c.fro:o.en===c.en)?1:0;
    return '<button class="opt'+(rom?' jp':'')+'" data-i="'+i+'" data-ok="'+ok+'">'+label+'</button>';
  }).join('');
  main.innerHTML='<div class="quizwrap">'+toggle+
    '<div class="qcard">'+c.svg+'<div class="qkanji mincho">'+c.k+'</div>'+
      '<div class="qprompt">'+promptTxt+'</div></div>'+
    '<div class="opts" id="opts">'+optsHTML+'</div>'+
    '<div class="qbar"><div class="score">Score '+score+' / '+asked+'</div>'+
      '<button class="qnext" id="qn" disabled>Next &#8250;</button></div>'+
  '</div>';
  asked++;
  document.querySelectorAll('.qtbtn').forEach(t=>t.onclick=()=>{if(quizType!==t.dataset.qt){quizType=t.dataset.qt;startQuiz();}});
  const btns=[...document.querySelectorAll('.opt')];
  btns.forEach(b=>b.onclick=()=>{
    if(b.disabled)return;
    const ok=b.dataset.ok==='1';
    btns.forEach(x=>{x.disabled=true;if(rom)x.textContent=opts[+x.dataset.i].en;if(x.dataset.ok==='1')x.classList.add('correct');});
    if(ok){score++;}else{b.classList.add('wrong');}
    document.querySelector('.score').textContent='Score '+score+' / '+asked;
    const qn=document.getElementById('qn');qn.disabled=false;
    qn.onclick=()=>{pos=(pos+1)%deck.length;renderQuiz();};
  });
}
function startQuiz(){buildDeck();score=0;asked=0;renderQuiz();}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');mode=t.dataset.m;
  if(mode==='quiz')startQuiz(); else {buildDeck();render();}
});
secSel.onchange=()=>{ if(mode==='quiz')startQuiz(); else {buildDeck();render();} };

buildDeck();render();
</script>
</body>
