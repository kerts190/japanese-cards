<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hiragana Flashcards</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;background:#e9e6dc;color:#2c2a26;
    display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;}
  .jp{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Hiragino Sans",sans-serif;}
  header{background:#7a4d7b;color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;flex:none;}
  .hrow{display:flex;align-items:center;gap:10px;}
  .hback{display:inline-flex;align-items:center;justify-content:center;min-width:54px;min-height:54px;
    font-size:34px;line-height:1;color:#fff;text-decoration:none;border-radius:14px;background:rgba(255,255,255,.14);flex:0 0 auto;}
  .hrow h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.5px;flex:1;}
  select{font-size:15px;padding:7px 8px;border-radius:9px;border:none;background:#fff;max-width:46%;}
  .tabs{display:flex;gap:8px;margin-top:10px;}
  .tab{flex:1;text-align:center;padding:9px 0;border-radius:10px;background:rgba(255,255,255,.18);color:#fff;
    font-size:14px;font-weight:600;cursor:pointer;border:none;opacity:.85;}
  .tab.on{background:#fff;color:#7a4d7b;opacity:1;}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;min-height:0;}
  .card{width:100%;max-width:440px;height:100%;max-height:620px;background:#fffdf7;border:1px solid #d9d3c2;
    border-radius:20px;box-shadow:0 8px 26px rgba(0,0,0,.16);display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:18px;position:relative;overflow:hidden;cursor:pointer;user-select:none;}
  .front{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}
  .kbig{font-size:170px;line-height:1;font-weight:700;}
  .secbadge{position:absolute;top:12px;left:14px;font-size:12px;color:#b3aa92;font-style:italic;}
  .flliphint{position:absolute;bottom:10px;font-size:12px;color:#c3bba6;letter-spacing:.5px;}
  .back{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%;flex:1;overflow-y:auto;}
  .card.flipped .front{display:none;}
  .card.flipped .back{display:flex;}
  .bk{font-size:84px;line-height:1;font-weight:700;}
  .brom{color:#c0392b;font-style:italic;font-size:44px;margin-top:8px;font-weight:600;}
  .say{color:#9a8f76;font-style:italic;font-size:18px;margin-top:8px;}
  .speak{margin-top:12px;width:52px;height:52px;border-radius:50%;border:none;background:#f0ece0;font-size:24px;cursor:pointer;}
  .bex{margin-top:16px;padding-top:14px;border-top:1px dashed #ddd4bf;width:90%;}
  .bex .jp2{font-size:30px;line-height:1.3;}
  .bex .ro{font-style:italic;color:#8a8472;font-size:17px;margin-top:5px;}
  .bex .en{font-size:19px;color:#4a463d;margin-top:5px;}
  .hl{color:#c0392b;font-weight:700;}
  .nav{display:flex;align-items:center;gap:16px;margin-top:12px;flex:none;padding-bottom:env(safe-area-inset-bottom);}
  .nav button{width:58px;height:58px;border-radius:50%;border:none;background:#7a4d7b;color:#fff;font-size:24px;cursor:pointer;}
  .counter{font-size:15px;color:#6b6557;min-width:88px;text-align:center;}
  .alllist{width:100%;max-width:520px;height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:9px;
    padding:2px 2px 24px;-webkit-overflow-scrolling:touch;}
  .acount{font-size:13px;color:#8a8472;text-align:center;flex:none;}
  .acard{background:#fffdf7;border:1px solid #d9d3c2;border-radius:14px;padding:10px 14px;display:flex;gap:14px;
    align-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.07);flex:none;}
  .acard .ak{font-size:40px;font-weight:700;flex:0 0 auto;min-width:52px;text-align:center;}
  .acard .arom{font-size:20px;color:#c0392b;font-style:italic;min-width:52px;font-weight:600;}
  .acard .ainfo{flex:1;min-width:0;}
  .acard .aex{font-size:15px;}
  .acard .aen{font-size:13px;color:#6b6557;}
  .quizwrap{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;gap:10px;min-height:0;}
  .qtype{display:flex;gap:8px;flex:none;}
  .qtbtn{flex:1;padding:8px 0;border-radius:10px;border:1px solid #d9d3c2;background:#fffdf7;color:#6b6557;font-size:14px;font-weight:600;cursor:pointer;}
  .qtbtn.on{background:#7a4d7b;color:#fff;border-color:#7a4d7b;}
  .qcard{flex:1;min-height:0;background:#fffdf7;border:1px solid #d9d3c2;border-radius:18px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:12px;box-shadow:0 6px 18px rgba(0,0,0,.12);}
  .qbig{font-size:110px;line-height:1;font-weight:700;}
  .qprompt{font-size:14px;color:#9a8f76;font-style:italic;margin-top:10px;}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:none;}
  .opt{min-height:58px;padding:8px;border-radius:13px;border:1px solid #d9d3c2;background:#fffdf7;font-size:22px;font-weight:700;cursor:pointer;}
  .opt.correct{background:#e6f2df;border-color:#4f8a3d;color:#2d5a20;}
  .opt.wrong{background:#fbe9e6;border-color:#c0392b;color:#96271b;}
  .qbar{display:flex;align-items:center;justify-content:space-between;flex:none;padding-bottom:env(safe-area-inset-bottom);}
  .score{font-size:15px;color:#6b6557;}
  .qnext{padding:12px 26px;border-radius:12px;border:none;background:#7a4d7b;color:#fff;font-size:16px;font-weight:600;cursor:pointer;}
  .qnext:disabled{opacity:.4;}
</style>
</head>

</header>

<script>
const ALL = JSON.parse(document.getElementById('cards').textContent);
const main = document.getElementById('main');
const secSel = document.getElementById('sec');
const GROUPS = {1:'Basic', 2:'\u309b\u309c Dakuten', 3:'Combos'};
let mode='browse', deck=[], pos=0, score=0, asked=0, quizType='torom';

(function(){
  let o='';
  for(let g=1;g<=3;g++){const n=ALL.filter(c=>c.g===g).length;o+='<option value="'+g+'">'+GROUPS[g]+' ('+n+')</option>';}
  o+='<option value="0">Everything ('+ALL.length+')</option>';
  secSel.innerHTML=o;
})();

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pool(){const s=+secSel.value;return s===0?ALL.slice():ALL.filter(c=>c.g===s);}
function buildDeck(){deck=pool();if(mode==='shuffle'||mode==='quiz')shuffle(deck);pos=0;}

let jaVoice=null;
function pickVoice(){
  if(!window.speechSynthesis)return;
  const bad=/(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley)/i;
  const vs=(speechSynthesis.getVoices()||[]).filter(v=>/^ja/i.test((v.lang||'').replace('_','-')));
  vs.sort((a,b)=>{const s=v=>(bad.test(v.name)?-100:0)+(/premium|enhanced/i.test(v.name+v.voiceURI)?50:0)+(/kyoko|otoya/i.test(v.name)?55:0);return s(b)-s(a);});
  jaVoice=vs[0]||null;
}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(t,slow){
  if(!window.speechSynthesis||!t)return;
  try{speechSynthesis.cancel();setTimeout(()=>{const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=slow?.35:.55;if(jaVoice)u.voice=jaVoice;speechSynthesis.speak(u);},180);}catch(e){}
}

function render(){
  if(mode==='quiz'){renderQuiz();return;}
  if(mode==='all'){renderAll();return;}
  const c=deck[pos];
  main.innerHTML=
    '<div class="card" id="cardEl">'+
      '<div class="secbadge">'+GROUPS[c.g]+'</div>'+
      '<div class="front"><div class="kbig jp">'+c.ch+'</div>'+
        '<button class="speak" id="fspk" style="margin-top:100px">\ud83d\udd0a</button></div>'+
      '<div class="back">'+
        '<div class="bk jp">'+c.ch+'</div>'+
        '<div class="brom">'+c.romaji+'</div>'+
        '<div class="say">say: \u201c'+c.say+'\u201d</div>'+
        '<button class="speak" id="spk">\ud83d\udd0a</button>'+
        (c.exjp?'<div class="bex"><div class="jp2 jp">'+c.exhl+'</div><div class="ro">'+c.exro+'</div><div class="en">'+c.exen+'</div>'+
        '<button class="speak" id="exspk" style="width:46px;height:46px;font-size:20px;margin-top:9px">\ud83d\udd0a</button></div>':'')+
      '</div>'+
      '<div class="flliphint">tap to flip</div>'+
    '</div>'+
    '<div class="nav">'+
      '<button id="prev">&#8249;</button>'+
      '<div class="counter">'+(pos+1)+' / '+deck.length+'</div>'+
      '<button id="next">&#8250;</button>'+
    '</div>';
  const card=document.getElementById('cardEl');
  document.getElementById('prev').onclick=e=>{e.stopPropagation();go(-1);};
  document.getElementById('next').onclick=e=>{e.stopPropagation();go(1);};
  document.getElementById('spk').onclick=e=>{e.stopPropagation();say(deck[pos].ch,true);};
  document.getElementById('fspk').onclick=e=>{e.stopPropagation();say(deck[pos].ch,true);};
  const exs=document.getElementById('exspk'); if(exs)exs.onclick=e=>{e.stopPropagation();say(deck[pos].exjp);};
  let sx=0,sy=0;
  card.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;});
  card.addEventListener('pointerup',e=>{
    if(e.target.closest&&e.target.closest('.speak'))return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){go(dx<0?1:-1);}
    else if(Math.abs(dx)<12&&Math.abs(dy)<12){card.classList.toggle('flipped');}
  });
}
function go(d){pos=(pos+d+deck.length)%deck.length;render();}

function renderAll(){
  deck=pool();
  const gname=+secSel.value===0?'Everything':GROUPS[+secSel.value];
  let h='<div class="alllist"><div class="acount">'+gname+' \u00b7 '+deck.length+' \u00b7 tap one to study it</div>';
  deck.forEach((c,i)=>{
    h+='<div class="acard" data-i="'+i+'"><div class="ak jp">'+c.ch+'</div>'+
       '<div class="arom">'+c.romaji+'</div>'+
       '<div class="ainfo"><div class="aex jp">'+c.exhl+' \u00b7 '+c.exro+'</div>'+
       '<div class="aen">'+c.exen+'</div></div></div>';
  });
  h+='</div>';
  main.innerHTML=h;
  document.querySelectorAll('.acard').forEach(el=>el.onclick=()=>{
    const i=+el.dataset.i;
    mode='browse';
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.m==='browse'));
    deck=pool();pos=i;render();
  });
}

function renderQuiz(){
  if(asked>=deck.length){
    main.innerHTML='<div class="quizwrap" style="justify-content:center"><div class="qcard">'+
      '<div style="font-size:34px;font-weight:700">Quiz complete!</div>'+
      '<div style="font-size:26px;margin-top:10px">You scored '+score+' / '+asked+'</div>'+
      '<button class="qnext" style="margin-top:18px" id="again">Play again</button></div></div>';
    document.getElementById('again').onclick=()=>{startQuiz();};
    return;
  }
  const c=deck[pos];
  const toKana=(quizType==='tokana');
  const toggle='<div class="qtype">'+
    '<button class="qtbtn'+(quizType==='torom'?' on':'')+'" data-qt="torom">Read it</button>'+
    '<button class="qtbtn'+(quizType==='tokana'?' on':'')+'" data-qt="tokana">Find it</button>'+
  '</div>';
  let others=pool().filter(x=>x.romaji!==c.romaji);
  shuffle(others);
  let opts=[c,...others.slice(0,3)];
  shuffle(opts);
  const promptTxt=toKana?'Which one is \u201c'+c.romaji+'\u201d?':'How do you read it?';
  const qface=toKana?'<div class="qbig jp">?</div><div style="font-size:54px;color:#c0392b;font-style:italic;font-weight:700">'+c.romaji+'</div>'
                    :'<div class="qbig jp">'+c.ch+'</div>';
  const optsHTML=opts.map((o,i)=>{
    const label=toKana?o.ch:o.romaji;
    const ok=o.romaji===c.romaji?1:0;
    return '<button class="opt'+(toKana?' jp':'')+'" data-i="'+i+'" data-ok="'+ok+'">'+label+'</button>';
  }).join('');
  main.innerHTML='<div class="quizwrap">'+toggle+
    '<div class="qcard">'+qface+'<div class="qprompt">'+promptTxt+'</div></div>'+
    '<div class="opts" id="opts">'+optsHTML+'</div>'+
    '<div class="qbar"><div class="score">Score '+score+' / '+asked+'</div>'+
      '<button class="qnext" id="qn" disabled>Next &#8250;</button></div>'+
  '</div>';
  asked++;
  document.querySelectorAll('.qtbtn').forEach(t=>t.onclick=()=>{if(quizType!==t.dataset.qt){quizType=t.dataset.qt;startQuiz();}});
  const btns=[...document.querySelectorAll('.opt')];
  btns.forEach(b=>b.onclick=()=>{
    if(b.disabled)return;
    const ok=b.dataset.ok==='1';
    btns.forEach(x=>{x.disabled=true;if(x.dataset.ok==='1')x.classList.add('correct');});
    if(ok){score++;say(c.ch,true);}else{b.classList.add('wrong');}
    document.querySelector('.score').textContent='Score '+score+' / '+asked;
    const qn=document.getElementById('qn');qn.disabled=false;
    qn.onclick=()=>{pos=(pos+1)%deck.length;renderQuiz();};
  });
}
function startQuiz(){buildDeck();score=0;asked=0;renderQuiz();}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');mode=t.dataset.m;
  if(mode==='quiz')startQuiz(); else {buildDeck();render();}
});
secSel.onchange=()=>{ if(mode==='quiz')startQuiz(); else {buildDeck();render();} };

buildDeck();render();
</script>
<script>
/* pull-to-refresh: drag down from the very top to reload fresh (clears app caches first) */
(function(){
  if(!('ontouchstart' in window))return;
  var THRESH=85, startY=0, dy=0, armed=false, busy=false;
  var el=document.createElement('div');
  el.setAttribute('style','position:fixed;top:-64px;left:50%;transform:translateX(-50%);z-index:9999;'+
    'display:flex;align-items:center;gap:8px;min-height:44px;padding:10px 20px;border-radius:999px;'+
    'background:rgba(31,35,40,.88);color:#fffdf7;font:600 15px -apple-system,BlinkMacSystemFont,sans-serif;'+
    'box-shadow:0 4px 14px rgba(0,0,0,.3);transition:top .18s;pointer-events:none');
  el.innerHTML='<span data-ptr-ic style="font-size:18px">&#8595;</span><span data-ptr-tx>Pull to refresh</span>';
  document.body.appendChild(el);
  var ic=el.querySelector('[data-ptr-ic]'), tx=el.querySelector('[data-ptr-tx]');
  function scrolled(t){ while(t&&t!==document.body){ if(t.scrollTop>0)return true; t=t.parentElement; } return false; }
  document.addEventListener('touchstart',function(e){
    if(busy||e.touches.length!==1)return;
    var t=e.target;
    if(t&&t.tagName==='CANVAS')return;               /* never fight the drawing pad */
    if((window.scrollY||document.documentElement.scrollTop||0)>0)return;
    if(scrolled(t))return;
    armed=true;startY=e.touches[0].clientY;dy=0;
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!armed||busy)return;
    dy=e.touches[0].clientY-startY;
    if(dy<=8){el.style.top='-64px';return;}
    el.style.top=(Math.min(dy*0.45,80)-52)+'px';
    tx.textContent = dy>THRESH ? 'Release to refresh' : 'Pull to refresh';
    ic.innerHTML  = dy>THRESH ? '&#8635;' : '&#8595;';
  },{passive:true});
  document.addEventListener('touchend',function(){
    if(!armed||busy)return;
    armed=false;
    if(dy>THRESH){
      busy=true; el.style.top='14px'; ic.innerHTML='&#8987;'; tx.textContent='Refreshing\u2026';
      (async function(){
        try{ if(navigator.serviceWorker){ var rs=await navigator.serviceWorker.getRegistrations(); for(var i=0;i<rs.length;i++){ try{await rs[i].update();}catch(e){} } } }catch(e){}
        try{ if(window.caches){ var ks=await caches.keys(); for(var j=0;j<ks.length;j++){ try{await caches.delete(ks[j]);}catch(e){} } } }catch(e){}
        location.reload();
      })();
    } else { el.style.top='-64px'; }
  },{passive:true});
})();
</script>

 function S(){try{return JSON.parse(localStorage.getItem('jv_set'))||{}}catch(e){return{}}}
 function eff(t){return t==='dark'||(t!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
 function ap(d){document.documentElement.classList.toggle('dark',d)}
 ap(eff(S().theme));
 var b=document.createElement('button');b.textContent='\u25d0';
 b.setAttribute('style','min-width:44px;min-height:44px;border:none;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-size:20px;cursor:pointer;flex:0 0 auto');
 var row=document.querySelector('.hrow')||document.querySelector('header');
 if(row)row.appendChild(b);
 b.onclick=function(){var st=S();var d=!eff(st.theme);st.theme=d?'dark':'light';
   try{localStorage.setItem('jv_set',JSON.stringify(st))}catch(e){}
   ap(d)};
})();</script>
