<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<title>Kotoba · Kana Writing</title>
<style>
:root{
  --bg:#faf8f3; --surface:#fff; --surface2:#f3f0e8; --ink:#1f2328; --muted:#6d7178; --line:#e6e1d6;
  --accent:#c0392b; --indigo:#1b4965; --green:#4f8a3d; --gold:#c9a227;
  --ghost:#d7d0be; --grid:#efebe0;
  --shadow:0 1px 2px rgba(31,35,40,.06), 0 8px 24px rgba(31,35,40,.07);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14161a; --surface:#1c1f25; --surface2:#23272f; --ink:#e9e7e2; --muted:#98a0aa; --line:#2c313a;
    --accent:#e56a55; --indigo:#7fb3d5; --green:#7cc25f; --gold:#d9b64a;
    --ghost:#39414d; --grid:#242932;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="light"]{
  --bg:#faf8f3; --surface:#fff; --surface2:#f3f0e8; --ink:#1f2328; --muted:#6d7178; --line:#e6e1d6;
  --accent:#c0392b; --indigo:#1b4965; --green:#4f8a3d; --gold:#c9a227;
  --ghost:#d7d0be; --grid:#efebe0;
  --shadow:0 1px 2px rgba(31,35,40,.06), 0 8px 24px rgba(31,35,40,.07);
}
:root[data-theme="dark"]{
  --bg:#14161a; --surface:#1c1f25; --surface2:#23272f; --ink:#e9e7e2; --muted:#98a0aa; --line:#2c313a;
  --accent:#e56a55; --indigo:#7fb3d5; --green:#7cc25f; --gold:#d9b64a;
  --ghost:#39414d; --grid:#242932;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
}
.jp{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}
button{font-family:inherit; touch-action:manipulation}

.app{
  height:100dvh; max-height:100dvh; width:100%; max-width:480px; margin:0 auto;
  display:flex; flex-direction:column; overflow:hidden;
  padding:max(6px, env(safe-area-inset-top)) 14px max(8px, env(safe-area-inset-bottom));
  gap:0;
}
/* In portrait the right-hand column dissolves so every child is ordered directly. */
.colR{display:contents}
.colL{order:4; flex:1 1 auto; min-height:0; min-width:0; display:flex}

/* ---------------- header ---------------- */
.hdr{order:1; display:flex; align-items:center; gap:6px; padding:2px 0 6px; flex:0 0 auto}
.iconbtn{
  width:44px; height:44px; flex:0 0 44px; border:0; background:transparent; color:var(--muted);
  border-radius:14px; font-size:20px; line-height:1; display:grid; place-items:center; cursor:pointer;
  transition:background .15s, color .15s;
}
.iconbtn:active{background:var(--surface2); color:var(--ink)}
.hdr-mid{flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:10px; justify-content:center}
.glyph{font-size:32px; line-height:1.05; font-weight:500; color:var(--ink); flex:0 0 auto}
.kmeta{min-width:0}
.meaning{font-size:14.5px; font-weight:600; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.reading{font-size:12.5px; color:var(--muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.counter{
  font-size:10.5px; font-weight:700; color:var(--muted); letter-spacing:.07em;
  background:var(--surface2); border-radius:999px; padding:5px 8px; white-space:nowrap; flex:0 0 auto;
}

/* ---------------- mode switch ---------------- */
.modebar{order:2; flex:0 0 auto; display:flex; gap:4px; background:var(--surface2); border-radius:13px; padding:3px; margin-bottom:8px}
.mbtn{
  flex:1 1 0; min-height:44px; border:0; background:transparent; color:var(--muted);
  border-radius:10px; font-size:13.5px; font-weight:650; cursor:pointer; letter-spacing:-.005em;
  display:flex; align-items:center; justify-content:center; gap:6px; transition:background .18s, color .18s, box-shadow .18s;
}
.mbtn[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mbtn .dot{width:7px; height:7px; border-radius:50%; background:currentColor; opacity:.45}
.mbtn[aria-pressed="true"] .dot{opacity:1; background:var(--indigo)}
.mbtn[aria-pressed="true"].mem .dot{background:var(--accent)}

/* ---------------- progress ---------------- */
.prog{order:3; flex:0 0 auto; display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:0 2px 8px}
.ptxt{font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ptxt b{color:var(--ink); font-weight:650; font-variant-numeric:tabular-nums}
.acc{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; flex:0 0 auto}
.acc b{color:var(--ink); font-weight:700}
.gradebadge{
  font-size:12px; font-weight:800; letter-spacing:.02em; padding:3px 9px; border-radius:999px;
  background:var(--surface2); color:var(--muted);
}
.gradebadge.s{background:color-mix(in srgb, var(--gold) 20%, transparent); color:var(--gold)}
.gradebadge.a{background:color-mix(in srgb, var(--green) 18%, transparent); color:var(--green)}
.gradebadge.b{background:color-mix(in srgb, var(--indigo) 18%, transparent); color:var(--indigo)}
.gradebadge.c{background:color-mix(in srgb, var(--accent) 15%, transparent); color:var(--accent)}

/* ---------------- stage / canvas ---------------- */
.stage{flex:1 1 auto; min-height:0; min-width:0; display:grid; place-items:center; overflow:hidden; position:relative}
#pad{
  display:block; border-radius:20px; background:var(--surface);
  box-shadow:0 0 0 1px var(--line), var(--shadow);
  touch-action:none; user-select:none; -webkit-user-select:none; cursor:crosshair;
}
.nudge{animation:nudge .34s ease}
@keyframes nudge{0%,100%{transform:none}22%{transform:translateX(-4px)}62%{transform:translateX(4px)}}

/* ---------------- rail (stroke order / results) ---------------- */
.rail{
  order:5; flex:0 0 auto; display:flex; gap:6px; overflow-x:auto; overflow-y:hidden;
  padding:9px 2px 5px; scrollbar-width:none; -webkit-overflow-scrolling:touch; scroll-behavior:smooth;
}
.rail::-webkit-scrollbar{display:none}
.tile{
  flex:0 0 auto; width:44px; height:44px; border-radius:11px; background:var(--surface);
  border:1px solid var(--line); display:grid; place-items:center; padding:3px; cursor:pointer;
  transition:border-color .2s, box-shadow .2s, opacity .2s; opacity:.5; position:relative;
}
.tile.done{opacity:1}
.tile.cur{opacity:1; border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent)}
.tile svg{width:100%; height:100%; display:block; pointer-events:none}
.tile svg path{fill:none; stroke:var(--muted); stroke-width:7; stroke-linecap:round; stroke-linejoin:round; opacity:.42}
.tile svg path.hi{stroke:var(--ink); opacity:1}
.tile.cur svg path.hi{stroke:var(--accent)}
.tile .pct{
  position:absolute; right:-1px; bottom:-1px; font-size:9px; font-weight:800; line-height:1;
  padding:2px 3px; border-radius:6px; background:var(--surface2); color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.tile.g-good{border-color:color-mix(in srgb, var(--green) 55%, var(--line))}
.tile.g-good .pct{background:color-mix(in srgb, var(--green) 18%, var(--surface2)); color:var(--green)}
.tile.g-mid{border-color:color-mix(in srgb, var(--gold) 55%, var(--line))}
.tile.g-mid .pct{background:color-mix(in srgb, var(--gold) 20%, var(--surface2)); color:var(--gold)}
.tile.g-bad{border-color:color-mix(in srgb, var(--accent) 50%, var(--line))}
.tile.g-bad .pct{background:color-mix(in srgb, var(--accent) 16%, var(--surface2)); color:var(--accent)}

/* memory-mode "captured" pips */
.pips{order:5; flex:0 0 auto; display:flex; gap:6px; align-items:center; height:52px; padding:0 2px; flex-wrap:wrap; overflow:hidden}
.pip{width:9px; height:9px; border-radius:50%; background:var(--line)}
.pip.on{background:var(--muted)}
.pips .lbl{font-size:12px; color:var(--muted); margin-right:4px}

/* ---------------- feedback ---------------- */
.fb{order:6; flex:0 0 auto; min-height:44px; display:flex; align-items:center; justify-content:center; gap:8px; padding:4px; text-align:center}
.fb-txt{font-size:13.5px; font-weight:550; color:var(--muted); transition:color .2s; line-height:1.3}
.fb.good .fb-txt{color:var(--green)}
.fb.bad .fb-txt{color:var(--accent)}
.fb.done .fb-txt{color:var(--ink)}
.chip{
  font-size:11.5px; font-weight:800; font-variant-numeric:tabular-nums; padding:3px 8px; border-radius:999px;
  background:var(--surface2); color:var(--muted); opacity:0; transform:translateY(3px);
  transition:opacity .2s, transform .2s; flex:0 0 auto;
}
.chip.show{opacity:1; transform:none}
.fb.good .chip{background:color-mix(in srgb, var(--green) 14%, transparent); color:var(--green)}
.fb.bad .chip{background:color-mix(in srgb, var(--accent) 13%, transparent); color:var(--accent)}

/* ---------------- controls ---------------- */
.controls{order:7; flex:0 0 auto; display:flex; gap:8px; padding-bottom:8px}
.btn{
  flex:1 1 0; min-height:50px; border-radius:15px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink); font-size:13.5px; font-weight:650; letter-spacing:-.005em; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:5px;
  transition:transform .09s ease, background .15s, opacity .15s, border-color .15s;
}
.btn:active{transform:scale(.97); background:var(--surface2)}
.btn[disabled]{opacity:.36; pointer-events:none}
.btn .ic{font-size:14px; line-height:1; opacity:.7}
.btn.hint{border-color:color-mix(in srgb, var(--indigo) 42%, var(--line)); color:var(--indigo)}
.btn.hint .ic{opacity:1}
.primary{
  order:8; flex:0 0 auto; width:100%; min-height:54px; border:0; border-radius:16px;
  background:var(--ink); color:var(--bg); font-size:15.5px; font-weight:700; cursor:pointer;
  box-shadow:var(--shadow); transition:transform .09s ease, background .2s, color .2s;
}
.primary:active{transform:scale(.985)}
.primary.ready{background:var(--accent); color:#fff; animation:breathe 2.2s ease-in-out infinite}
.primary.check{background:var(--indigo); color:#fff}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 34%, transparent)}50%{box-shadow:0 0 0 9px color-mix(in srgb, var(--accent) 0%, transparent)}}

.hidden{display:none !important}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important}
  .rail{scroll-behavior:auto}
}

/* ---------------- short viewports / landscape ---------------- */
@media (max-height:700px) and (orientation:portrait){
  .glyph{font-size:28px}
  .rail{padding:6px 2px 3px}
  .fb{min-height:40px}
  .modebar{margin-bottom:6px}
}
/* Very short phones: the stroke strip is a supplementary aid and giving its
   50px back to the pad matters more. "Show me" covers the same need. */
@media (max-height:620px) and (orientation:portrait){
  .rail{display:none !important}
  .pips{height:38px}
  .modebar{margin-bottom:4px}
}
@media (orientation:landscape) and (max-height:600px){
  .app{max-width:900px; flex-direction:row; gap:14px; padding-top:max(6px, env(safe-area-inset-top))}
  .colR{display:flex; flex-direction:column; flex:0 0 min(330px, 46%); min-width:0; overflow-y:auto; overscroll-behavior:contain}
  .colL{order:0; flex:1 1 auto; align-items:center; justify-content:center}
  .hdr{padding-top:0}
  .glyph{font-size:26px}
  .rail{display:none !important}
  .pips{height:34px}
  .fb{min-height:36px}
  .btn{min-height:46px}
  .primary{min-height:48px}
}
</style>
</head>
<body>
<div class="app" id="app">

  <div class="colL"><div class="stage" id="stage">
    <canvas id="pad" width="300" height="300"
            aria-label="Writing pad. Draw the current kanji stroke with your finger or mouse."></canvas>
  </div></div>

  <div class="colR">
    <header class="hdr">
      <button class="iconbtn" id="prevBtn" aria-label="Previous kanji" type="button">‹</button>
      <div class="hdr-mid">
        <div class="glyph jp" id="glyph" aria-hidden="true">学</div>
        <div class="kmeta">
          <div class="meaning" id="meaning">to study</div>
          <div class="reading jp" id="reading">まな(ぶ)</div>
        </div>
      </div>
      <div class="counter" id="counter">1/10</div>
      <button class="iconbtn" id="themeBtn" aria-label="Change theme" type="button">◐</button>
    </header>

    <div class="modebar" role="group" aria-label="Practice mode">
      <button class="mbtn" id="modeTrace" type="button" aria-pressed="true"><span class="dot"></span>Trace</button>
      <button class="mbtn mem" id="modeMem" type="button" aria-pressed="false"><span class="dot"></span>Memory</button>
    </div>
    <div style="display:flex;gap:8px;padding:8px 0 6px;flex:0 0 auto;align-items:center">
      <a href="../" aria-label="Back"
         onclick="try{if(history.length>1&&document.referrer&&new URL(document.referrer).origin===location.origin){history.back();return false}}catch(e){}"
         style="display:inline-flex;align-items:center;justify-content:center;min-width:48px;min-height:44px;border-radius:12px;background:var(--surface2);color:var(--ink);text-decoration:none;font-size:26px;line-height:1">&#8249;</a>
      <select id="gradeSel" style="flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;padding:0 10px"></select>
      <button id="shufBtn" type="button" aria-label="Shuffle"
        style="min-width:48px;min-height:44px;border:0;border-radius:12px;background:var(--surface2);color:var(--ink);font-size:20px;cursor:pointer">&#128256;</button>
    </div>

    <div class="prog">
      <div class="ptxt" id="ptxt">Stroke <b>1</b> of 8</div>
      <div class="acc" id="acc"></div>
    </div>

    <div class="rail" id="rail" role="list" aria-label="Stroke order"></div>
    <div class="pips hidden" id="pips" aria-hidden="true"></div>

    <div class="fb" id="fb">
      <span class="fb-txt" id="fbTxt" role="status" aria-live="polite">Trace the blue stroke — start at the red dot.</span>
      <span class="chip" id="chip" aria-hidden="true"></span>
    </div>

    <div class="controls">
      <button class="btn" id="undoBtn" type="button"><span class="ic" id="undoIc">↺</span><span id="undoLbl">Undo</span></button>
      <button class="btn" id="clearBtn" type="button"><span class="ic">✕</span>Clear</button>
      <button class="btn hint" id="showBtn" type="button"><span class="ic">▶</span><span id="showLbl">Show me</span></button>
    </div>
    <button class="primary" id="primaryBtn" type="button">Next kanji</button>
    <div style="flex:0 0 auto;text-align:center;font-size:9.5px;color:var(--muted);padding-top:4px">stroke data: <a href="https://kanjivg.tagaini.net" style="color:var(--muted)">KanjiVG</a> &middot; CC BY-SA</div>
  </div>
</div>

    const b = [a[0]];
    for (let i=1;i<a.length-1;i++){
      b.push({ x:(a[i-1].x + a[i].x*2 + a[i+1].x)/4, y:(a[i-1].y + a[i].y*2 + a[i+1].y)/4 });
    }
    b.push(a[a.length-1]);
    a = b;
  }
  return a;
}

/* ============================================================
   Reference stroke construction (cached per kanji)
   ============================================================ */
function safePath(d){ try { return new Path2D(d); } catch(e){ return null; } }

function buildStroke(d){
  measPath.setAttribute("d", d);
  let len = 0;
  try { len = measPath.getTotalLength(); } catch(e){ len = 0; }

  if (!isFinite(len) || len <= 0.05){
    const m = /M\s*(-?[\d.]+)[,\s]+(-?[\d.]+)/.exec(d);
    const p = m ? {x:+m[1], y:+m[2]} : {x:VB/2, y:VB/2};
    const pts = []; for (let i=0;i<NS;i++) pts.push({x:p.x, y:p.y});
    return {d:d, len:1, chord:0, pts:pts, dense:[p,p], path:safePath(d), hook:false, tv:{x:0,y:0}};
  }

  const at = f => { const p = measPath.getPointAtLength(len * clamp01(f)); return {x:p.x, y:p.y}; };
  const pts = []; for (let i=0;i<NS;i++) pts.push(at(i/(NS-1)));
  const steps = clamp(Math.ceil(len/1.0), 20, 240);
  const dense = []; for (let i=0;i<=steps;i++) dense.push(at(i/steps));

  // Terminal turn (hane / hook / ore). If the last stretch of the stroke swings
  // away from the body direction, the ending is a taught feature and gets its
  // own scoring term — this is the thing the prototypes were blind to.
  const tv = vsub(at(1), at(0.87));
  const bv = vsub(at(0.85), at(0.52));
  const tl = vlen(tv), bl = vlen(bv);
  const tcos = (tl > 0.4 && bl > 0.4) ? (tv.x*bv.x + tv.y*bv.y)/(tl*bl) : 1;
  const hook = tl > Math.max(2.0, len*0.04) && tcos < 0.45;

  return {
    d:d, len:len, chord:polyLength(pts), pts:pts, dense:dense, path:safePath(d),
    hook:hook, tv: tl > 1e-6 ? {x:tv.x/tl, y:tv.y/tl} : {x:0,y:0}
  };
}

const strokeCache = new Map();
function strokesFor(k){
  if (!strokeCache.has(k)) strokeCache.set(k, DATA.sample_strokes[k].map(buildStroke));
  return strokeCache.get(k);
}

/* ============================================================
   SCORING
   Forgiving of a shaky hand. Strict about the four things that
   are actually wrong to learn: direction, gross position,
   stopping short / running long, and a dropped hook.
   `tol` widens the position tolerances for Memory mode, where
   there is no guide to line up against.
   ============================================================ */
function judge(userPts109, ref, tol){
  const T = tol || 1;
  const u = resample(smooth(userPts109, 2), NS);
  const r = ref.pts;
  if (!u.length) return {score:0, pass:false, reason:"close", meanD:99, ratio:0, dirCos:0, tailCos:0};

  let sum = 0, rev = 0, maxD = 0;
  for (let i=0;i<NS;i++){
    const dd = dist(u[i], r[i]);
    sum += dd; if (dd > maxD) maxD = dd;
    rev += dist(u[i], r[NS-1-i]);
  }
  const meanD = sum/NS, revD = rev/NS;
  const startD = dist(u[0], r[0]);
  const endD   = dist(u[NS-1], r[NS-1]);

  // Direction: strided tangent agreement (jitter-proof) blended with the
  // net chord direction.
  const ST = 3;
  let cs = 0, cn = 0;
  for (let i=0;i+ST<NS;i++){
    const ux = u[i+ST].x-u[i].x, uy = u[i+ST].y-u[i].y;
    const rx = r[i+ST].x-r[i].x, ry = r[i+ST].y-r[i].y;
    const ul = Math.hypot(ux,uy), rl = Math.hypot(rx,ry);
    if (ul < 1e-4 || rl < 1e-4) continue;
    cs += (ux*rx + uy*ry)/(ul*rl); cn++;
  }
  const segCos = cn ? cs/cn : 0;
  const un = vsub(u[NS-1], u[0]), rn = vsub(r[NS-1], r[0]);
  const unl = vlen(un), rnl = vlen(rn);
  const netCos = (unl > 1e-3 && rnl > 1e-3) ? (un.x*rn.x + un.y*rn.y)/(unl*rnl) : segCos;
  const dirCos = 0.65*segCos + 0.35*netCos;

  // Tail direction — only meaningful when the reference actually turns.
  let tailCos = 1;
  if (ref.hook){
    const ut = vsub(u[NS-1], u[NS-4]);
    const utl = vlen(ut);
    tailCos = utl > 1e-4 ? (ut.x*ref.tv.x + ut.y*ref.tv.y)/utl : 0;
  }

  // Length, compared like with like (both are NS-point resample lengths).
  // The user's copy is smoothed once more before measuring: white digitiser
  // noise inflates arc length badly on short strokes and would otherwise read
  // as "you drew it too long".
  const uLen = polyLength(smooth(u, 1));
  const ratio = uLen / Math.max(0.001, ref.chord);
  const shortRef = ref.len < 18;
  const lenErr = ratio < 1 ? (1 - ratio) : (ratio - 1) * (shortRef ? 0.30 : 0.55);

  // Tolerances. `free` is fully forgiven, `zero` is where the term dies.
  const meanFree = clamp(ref.len*0.085, 1.6, 3.0) * T;
  const meanZero = meanFree + 8.5*T;
  const endBase  = clamp(ref.len*0.11, 2.0, 4.2) * T;
  const endFree  = ref.hook ? endBase*0.55 : endBase;
  const endZero  = endFree + (ref.hook ? 9 : 12)*T;
  const maxFree  = meanFree*2.3;
  const maxZero  = maxFree + 16*T;

  const sMean  = falloff(meanD,  meanFree, meanZero);
  const sStart = falloff(startD, endBase,  endBase + 12*T);
  const sEnd   = falloff(endD,   endFree,  endZero);
  const sMax   = falloff(maxD,   maxFree,  maxZero);
  const sDir   = 100 * clamp01((dirCos - 0.55) / 0.40);
  const sLen   = falloff(lenErr, 0.06, 0.34);
  const sTail  = ref.hook ? 100 * clamp01((tailCos - 0.15) / 0.60) : 100;

  const W = ref.hook
    ? {mean:.24, start:.10, end:.20, max:.06, dir:.12, len:.14, tail:.14}
    : {mean:.32, start:.12, end:.16, max:.08, dir:.14, len:.18, tail:0};

  let score = W.mean*sMean + W.start*sStart + W.end*sEnd + W.max*sMax
            + W.dir*sDir  + W.len*sLen     + W.tail*sTail;

  // ---- gates, most diagnostic first ----
  // "backwards" needs BOTH a low cosine and a better reverse match, so a
  // perpendicular or misplaced stroke is never mislabelled as reversed.
  const backwards = (dirCos < 0.15) && (revD < meanD * 0.85);
  let reason = "ok";
  if (backwards)                              { score = Math.min(score, 16); reason = "back"; }
  else if (dirCos < 0.42)                     { score = Math.min(score, 48); reason = "shape"; }
  else if (ratio < 0.84)                      { score = Math.min(score, 50); reason = "short"; }
  // Overshoot must show up at the END POINT as well as in arc length, so a
  // tremor that inflates length can never be mistaken for running long.
  else if (ratio > (shortRef ? 2.1 : 1.65) && endD > Math.max(5, endBase*1.5))
                                              { score = Math.min(score, 52); reason = "long"; }
  else if (meanD > 8.5*T || startD > 11.5*T)  { score = Math.min(score, 50); reason = "place"; }
  else if (ref.hook && tailCos < 0.42)        { score = Math.min(score, 62); reason = "hook"; }

  score = Math.round(clamp(score, 0, 100));
  const pass = (reason === "ok") && score >= PASS;
  if (reason === "ok" && !pass) reason = "close";

  return {score:score, pass:pass, reason:reason, meanD:meanD, startD:startD, endD:endD,
          maxD:maxD, ratio:ratio, dirCos:dirCos, tailCos:tailCos, hook:!!ref.hook};
}

/* Direction-agnostic closeness, used only to diagnose stroke-order mistakes. */
function affinity(userPts109, ref){
  const u = resample(userPts109, NS), r = ref.pts;
  if (!u.length) return 1e9;
  let f = 0, b = 0;
  for (let i=0;i<NS;i++){ f += dist(u[i], r[i]); b += dist(u[i], r[NS-1-i]); }
  return Math.min(f, b) / NS;
}

/* ============================================================
   DOM
   ============================================================ */
const cv      = document.getElementById("pad");
const ctx     = cv.getContext("2d");
const stage   = document.getElementById("stage");
const elGlyph = document.getElementById("glyph");
const elMean  = document.getElementById("meaning");
const elRead  = document.getElementById("reading");
const elCnt   = document.getElementById("counter");
const elPtxt  = document.getElementById("ptxt");
const elAcc   = document.getElementById("acc");
const elRail  = document.getElementById("rail");
const elPips  = document.getElementById("pips");
const elFb    = document.getElementById("fb");
const elFbTxt = document.getElementById("fbTxt");
const elChip  = document.getElementById("chip");
const btnUndo = document.getElementById("undoBtn");
const undoIc  = document.getElementById("undoIc");
const undoLbl = document.getElementById("undoLbl");
const btnClear= document.getElementById("clearBtn");
const btnShow = document.getElementById("showBtn");
const lblShow = document.getElementById("showLbl");
const btnMain = document.getElementById("primaryBtn");
const btnPrev = document.getElementById("prevBtn");
const btnTheme= document.getElementById("themeBtn");
const btnTrace= document.getElementById("modeTrace");
const btnMem  = document.getElementById("modeMem");

/* ============================================================
   State
   ============================================================ */
let PAL = {};
let size = 300, dpr = 1, sc = size/VB;
let mode = "trace";              // "trace" | "memory"
let phase = "draw";              // "draw" | "result"
let kIndex = 0;
let strokes = [];
let step = 0;                    // trace: strokes committed. memory: strokes drawn.
let recs = [];                   // per-stroke {score, tries, hint}
let userInk = [];                // memory mode: committed polylines in 109-space
let misses = 0;                  // consecutive misses on the current stroke
let hinted = false;              // hint used on the current stroke
let live = null;                 // {pts:[css px]} while the finger is down
let settle = null;               // accept crossfade
let anim = null;                 // stroke demonstration
let helpTimer = 0;               // auto-demo timer handle (must be cancellable)
let doneAt = 0;                  // seal timestamp
let result = null;               // computed grade
let mainRole = "";               // current job of the primary button
let roleChangedAt = 0;           // when it last changed job
let sessionScores = [];

/* base layer cache — everything that does not change frame to frame */
const base = document.createElement("canvas");
const bctx = base.getContext("2d");
let baseDirty = true;

function readPalette(){
  const cs = getComputedStyle(document.documentElement);
  const g = n => (cs.getPropertyValue(n) || "").trim() || "#888";
  PAL = {
    surface:g("--surface"), surface2:g("--surface2"), ink:g("--ink"), muted:g("--muted"),
    line:g("--line"), accent:g("--accent"), indigo:g("--indigo"), green:g("--green"),
    gold:g("--gold"), ghost:g("--ghost"), grid:g("--grid"), bg:g("--bg")
  };
}

/* Brush and reference ink are the SAME visual width, so the accept
   crossfade is a dissolve rather than a weight pop. */
function brushPx(){ return clamp(3.4*sc, 8, 13); }
function inkUnits(){ return brushPx()/sc; }

/* ============================================================
   Sizing — retina correct, no border, no layout feedback loop
   ============================================================ */
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  const s = Math.max(120, Math.floor(Math.min(w || 300, h || 300, 460)));
  const d = clamp(window.devicePixelRatio || 1, 1, 3);
  if (s === size && d === dpr) return;      // stops the ResizeObserver loop
  size = s; dpr = d; sc = size/VB;
  cv.style.width  = size + "px";
  cv.style.height = size + "px";
  cv.width  = Math.round(size*dpr);
  cv.height = Math.round(size*dpr);
  base.width = cv.width; base.height = cv.height;
  rectCache = null;
  markBase();
  requestPaint();
}
/* Belt AND braces. ResizeObserver alone is not enough: it can be throttled or
   absent, and then the pad never re-fits. resize() early-returns when nothing
   actually changed, so listening twice costs nothing. */
if (window.ResizeObserver){
  try { new ResizeObserver(() => resize()).observe(stage); } catch(e){}
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => { resize(); setTimeout(resize, 260); });
if (window.visualViewport && window.visualViewport.addEventListener){
  // iOS toolbars sliding in and out change the usable height
  window.visualViewport.addEventListener("resize", resize);
}
/* devicePixelRatio can change without the CSS box changing (moving windows
   between displays, desktop zoom) — watch for it. */
if (window.matchMedia){
  let dprMq = null;
  const watchDpr = () => {
    if (dprMq && dprMq.removeEventListener) dprMq.removeEventListener("change", onDpr);
    dprMq = window.matchMedia("(resolution: " + (window.devicePixelRatio||1) + "dppx)");
    if (dprMq.addEventListener) dprMq.addEventListener("change", onDpr);
  };
  const onDpr = () => { const s0 = size; size = -1; resize(); if (size === -1) size = s0; watchDpr(); };
  watchDpr();
}

/* ============================================================
   Drawing primitives
   ============================================================ */
function refStroke(c, st, color, widthUnits, alpha){
  c.save();
  c.globalAlpha = alpha === undefined ? 1 : alpha;
  c.strokeStyle = color; c.lineCap = "round"; c.lineJoin = "round";
  if (st.path){
    c.scale(sc, sc);
    c.lineWidth = widthUnits;
    c.stroke(st.path);
  } else {
    c.lineWidth = widthUnits*sc;
    c.beginPath();
    for (let i=0;i<st.dense.length;i++){
      const p = st.dense[i];
      if (i === 0) c.moveTo(p.x*sc, p.y*sc); else c.lineTo(p.x*sc, p.y*sc);
    }
    c.stroke();
  }
  c.restore();
}

function partialRef(c, st, frac, color, widthUnits, alpha){
  const n = Math.max(2, Math.round(st.dense.length * clamp01(frac)));
  c.save();
  c.globalAlpha = alpha === undefined ? 1 : alpha;
  c.strokeStyle = color; c.lineCap = "round"; c.lineJoin = "round";
  c.lineWidth = widthUnits*sc;
  c.beginPath();
  for (let i=0;i<n;i++){
    const p = st.dense[i];
    if (i === 0) c.moveTo(p.x*sc, p.y*sc); else c.lineTo(p.x*sc, p.y*sc);
  }
  c.stroke();
  c.restore();
  return st.dense[n-1];
}

/* pts are CSS px unless `unit` is true, in which case they are 109-space */
function inkPoly(c, pts, color, widthPx, alpha, unit){
  if (!pts || !pts.length) return;
  const k = unit ? sc : 1;
  c.save();
  c.globalAlpha = alpha === undefined ? 1 : alpha;
  c.strokeStyle = color; c.fillStyle = color;
  c.lineWidth = widthPx; c.lineCap = "round"; c.lineJoin = "round";
  if (pts.length === 1){
    c.beginPath(); c.arc(pts[0].x*k, pts[0].y*k, widthPx/2, 0, Math.PI*2); c.fill(); c.restore(); return;
  }
  c.beginPath();
  c.moveTo(pts[0].x*k, pts[0].y*k);
  for (let i=1;i<pts.length-1;i++){
    const mx = (pts[i].x + pts[i+1].x)/2 * k, my = (pts[i].y + pts[i+1].y)/2 * k;
    c.quadraticCurveTo(pts[i].x*k, pts[i].y*k, mx, my);
  }
  const last = pts[pts.length-1];
  c.lineTo(last.x*k, last.y*k);
  c.stroke();
  c.restore();
}

function drawGrid(c){
  const m = size*0.05;
  c.save();
  c.strokeStyle = PAL.grid; c.lineWidth = 1;
  c.setLineDash([5,7]);
  c.beginPath();
  c.moveTo(size/2, m); c.lineTo(size/2, size-m);
  c.moveTo(m, size/2); c.lineTo(size-m, size/2);
  c.stroke();
  c.setLineDash([]);
  c.globalAlpha = 0.7;
  c.strokeRect(m, m, size-m*2, size-m*2);
  c.restore();
}

/* One source of truth for the good / fair / poor bands, so the canvas tint
   and the rail tiles can never disagree with each other. */
const BAND_GOOD = 85, BAND_FAIR = 65;
function bandOf(v){ return v >= BAND_GOOD ? "good" : (v >= BAND_FAIR ? "fair" : "poor"); }
function tintFor(v){
  if (v === null || v === undefined) return PAL.accent;
  const b = bandOf(v);
  return b === "good" ? PAL.green : (b === "fair" ? PAL.gold : PAL.accent);
}

/* ------- base layer: everything static for the current state ------- */
function markBase(){ baseDirty = true; }

function buildBase(){
  bctx.setTransform(dpr,0,0,dpr,0,0);
  bctx.clearRect(0,0,size,size);
  bctx.fillStyle = PAL.surface;
  bctx.fillRect(0,0,size,size);
  drawGrid(bctx);

  const total = strokes.length;
  const iu = inkUnits();

  if (phase === "result"){
    // the learner's own ink stays visible underneath the correction
    for (let i=0;i<userInk.length;i++) inkPoly(bctx, userInk[i], PAL.ink, brushPx(), 0.30, true);
    for (let i=0;i<total;i++){
      const rec = recs[i];
      const col = rec ? tintFor(rec.final) : PAL.accent;
      refStroke(bctx, strokes[i], col, iu, rec ? 0.95 : 0.34);
    }
    return;
  }

  if (mode === "trace"){
    // upcoming strokes, ghosted
    for (let i=step+1;i<total;i++) refStroke(bctx, strokes[i], PAL.ghost, iu*1.05, 0.5);
    // current stroke highlight
    if (step < total) {
      refStroke(bctx, strokes[step], PAL.indigo, iu*1.25, 0.16);
      refStroke(bctx, strokes[step], PAL.indigo, iu*0.66, 0.6);
    }
    // FIX: completed ink is painted AFTER the highlight, and the pulsing start
    // dot is painted in the live layer above everything, so it is never buried.
    for (let i=0;i<step;i++) refStroke(bctx, strokes[i], PAL.ink, iu, 1);
  } else {
    for (let i=0;i<userInk.length;i++) inkPoly(bctx, userInk[i], PAL.ink, brushPx(), 0.95, true);
  }
}

/* ------- composite frame ------- */
function paint(now){
  if (baseDirty){ buildBase(); baseDirty = false; }
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(base, 0, 0);
  ctx.setTransform(dpr,0,0,dpr,0,0);

  const t = now || performance.now();
  const iu = inkUnits();

  // stroke demonstration
  if (anim){
    const idx = anim.list[anim.k];
    const st = strokes[idx];
    if (!st){ anim = null; }
    else {
      for (let j=0;j<anim.k;j++) refStroke(ctx, strokes[anim.list[j]], PAL.accent, iu, 0.85);
      refStroke(ctx, st, PAL.indigo, iu*1.1, 0.18);
      const el = t - anim.t0;
      const frac = clamp01(el / anim.dur[anim.k]);
      const head = partialRef(ctx, st, frac, PAL.accent, iu*0.72, 1);
      if (anim.numbers){
        const p0 = st.pts[0];
        ctx.save();
        ctx.fillStyle = PAL.accent;
        ctx.beginPath(); ctx.arc(p0.x*sc, p0.y*sc, 7.2*sc*0.55 + 5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = "700 " + Math.round(Math.max(9, 4.6*sc)) + "px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(String(idx+1), p0.x*sc, p0.y*sc + 0.5);
        ctx.restore();
      }
      if (head){
        ctx.save();
        ctx.fillStyle = PAL.accent;
        ctx.beginPath(); ctx.arc(head.x*sc, head.y*sc, iu*0.62*sc, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 0.2;
        ctx.beginPath(); ctx.arc(head.x*sc, head.y*sc, iu*1.35*sc, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }
      if (el > anim.dur[anim.k] + anim.gap){
        anim.k++;
        anim.t0 = t;
        if (anim.k >= anim.list.length){ anim = null; syncUI(); }
      }
    }
  }

  // pulsing start dot — always on top of finished ink
  if (!anim && phase === "draw" && mode === "trace" && step < strokes.length){
    const p0 = strokes[step].pts[0];
    const pulse = REDUCED ? 0.5 : (Math.sin(t/470) + 1)/2;
    ctx.save();
    ctx.globalAlpha = 0.28*(1-pulse);
    ctx.fillStyle = PAL.accent;
    ctx.beginPath(); ctx.arc(p0.x*sc, p0.y*sc, (iu*0.7 + iu*0.9*pulse)*sc, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(p0.x*sc, p0.y*sc, iu*0.62*sc, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // accept crossfade
  if (settle){
    const p = clamp01((t - settle.t0)/260);
    inkPoly(ctx, settle.pts, PAL.green, brushPx(), 1-p, false);
    if (p >= 1){ settle = null; }
  }

  // live finger stroke
  if (live && live.pts.length) inkPoly(ctx, live.pts, PAL.ink, brushPx(), 0.94, false);

  // completion seal
  if (phase === "result" && doneAt) drawSeal(t - doneAt);
}

function drawSeal(el){
  const s = size*0.13;
  const grow = clamp01(el/340);
  const e = 1 - Math.pow(1-grow, 3);
  ctx.save();
  ctx.globalAlpha = e;
  ctx.translate(size - s*0.5 - size*0.07, size - s*0.5 - size*0.07);
  ctx.rotate((1-e)*0.5 - 0.045);
  ctx.scale(0.7 + 0.3*e, 0.7 + 0.3*e);
  const r = s*0.16, h = s/2;
  ctx.fillStyle = PAL.accent;
  ctx.beginPath();
  ctx.moveTo(-h+r, -h);
  ctx.arcTo(h,-h,h,h,r); ctx.arcTo(h,h,-h,h,r); ctx.arcTo(-h,h,-h,-h,r); ctx.arcTo(-h,-h,h,-h,r);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.font = "600 " + Math.round(s*0.58) + 'px "Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif';
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("完", 0, s*0.04);
  ctx.restore();
}

/* ------- paint scheduling: idle frames are cheap and throttled ------- */
const REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
let rafId = 0, lastIdlePaint = 0, pendingOnce = false;

function busyAnimating(){
  return !!(live || settle || anim || (phase === "result" && doneAt && performance.now()-doneAt < 700));
}
function pulseNeeded(){
  return !REDUCED && phase === "draw" && mode === "trace" && step < strokes.length && !anim;
}
function frame(t){
  rafId = 0;
  if (busyAnimating()){
    paint(t); schedule();
  } else if (pulseNeeded()){
    if (t - lastIdlePaint > 32){ lastIdlePaint = t; paint(t); }
    schedule();
  } else if (pendingOnce){
    pendingOnce = false; paint(t);
  }
}
function schedule(){ if (!rafId) rafId = requestAnimationFrame(frame); }
function requestPaint(){ pendingOnce = true; schedule(); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) requestPaint(); });

/* ============================================================
   INPUT — pointer / touch / mouse, single-pointer, no scroll
   ============================================================ */
let rectCache = null;
function padRect(){
  if (!rectCache) rectCache = cv.getBoundingClientRect();
  return rectCache;
}
function invalidateRect(){ rectCache = null; }
window.addEventListener("scroll", invalidateRect, true);
window.addEventListener("resize", invalidateRect);

function localPoint(clientX, clientY){
  const r = padRect();
  return {x: clientX - r.left, y: clientY - r.top};
}

let activeId = null;

function beginStroke(pt){
  if (phase !== "draw") return;
  if (mode === "trace" && step >= strokes.length) return;
  cancelHelp();
  anim = null;
  invalidateRect();
  live = {pts:[pt]};
  requestPaint();
}
function extendStroke(pt){
  if (!live) return;
  const last = live.pts[live.pts.length-1];
  if (dist(last, pt) < 1.05) return;
  live.pts.push(pt);
}
function endStroke(){
  if (!live) return;
  const pts = live.pts;
  live = null;
  // Speck / palm-tap filter: too short to be a stroke is ALWAYS discarded,
  // silently. It never scores, never counts as a miss, never triggers help.
  const minLen = Math.max(9, size*0.032);
  if (pts.length < 2 || polyLength(pts) < minLen){ requestPaint(); return; }
  commit(pts);
}

const usePointer = !!window.PointerEvent;
if (usePointer){
  cv.addEventListener("pointerdown", e => {
    if (activeId !== null) return;                       // ignore palm / 2nd finger
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    activeId = e.pointerId;
    try { cv.setPointerCapture(e.pointerId); } catch(err){}
    beginStroke(localPoint(e.clientX, e.clientY));
  });
  cv.addEventListener("pointermove", e => {
    if (e.pointerId !== activeId || !live) return;
    e.preventDefault();
    if (e.getCoalescedEvents){
      let evs = null;
      try { evs = e.getCoalescedEvents(); } catch(err){ evs = null; }
      if (evs && evs.length){
        for (let i=0;i<evs.length;i++) extendStroke(localPoint(evs[i].clientX, evs[i].clientY));
        requestPaint(); return;
      }
    }
    extendStroke(localPoint(e.clientX, e.clientY));
    requestPaint();
  });
  const finish = e => {
    if (e.pointerId !== activeId) return;
    activeId = null;
    endStroke();
  };
  cv.addEventListener("pointerup", finish);
  cv.addEventListener("pointercancel", finish);
  cv.addEventListener("lostpointercapture", e => {
    // never let a lost capture wedge the pad shut
    if (e.pointerId === activeId){ activeId = null; endStroke(); }
  });
  // Safety net: if the up event escapes the canvas entirely.
  window.addEventListener("pointerup", e => {
    if (activeId !== null && e.pointerId === activeId){ activeId = null; endStroke(); }
  });
  // Belt and braces so iOS never scrolls or rubber-bands under the finger.
  ["touchstart","touchmove","touchend","touchcancel"].forEach(ev =>
    cv.addEventListener(ev, e => e.preventDefault(), {passive:false}));
} else {
  cv.addEventListener("touchstart", e => {
    e.preventDefault();
    if (activeId !== null) return;
    const t = e.changedTouches[0];
    activeId = t.identifier;
    beginStroke(localPoint(t.clientX, t.clientY));
  }, {passive:false});
  cv.addEventListener("touchmove", e => {
    e.preventDefault();
    for (let i=0;i<e.changedTouches.length;i++){
      const t = e.changedTouches[i];
      if (t.identifier !== activeId) continue;           // only the writing finger
      extendStroke(localPoint(t.clientX, t.clientY));
    }
    requestPaint();
  }, {passive:false});
  const tEnd = e => {
    e.preventDefault();
    for (let i=0;i<e.changedTouches.length;i++){
      if (e.changedTouches[i].identifier === activeId){ activeId = null; endStroke(); return; }
    }
  };
  cv.addEventListener("touchend", tEnd, {passive:false});
  cv.addEventListener("touchcancel", tEnd, {passive:false});
  cv.addEventListener("mousedown", e => {
    if (e.button !== 0) return;
    e.preventDefault(); activeId = "mouse";
    beginStroke(localPoint(e.clientX, e.clientY));
  });
  window.addEventListener("mousemove", e => { if (live){ extendStroke(localPoint(e.clientX, e.clientY)); requestPaint(); } });
  window.addEventListener("mouseup", () => { if (activeId === "mouse"){ activeId = null; endStroke(); } });
}
/* Scoped to the pad: pinch-zoom still works everywhere else (WCAG 1.4.4). */
cv.addEventListener("gesturestart", e => e.preventDefault());

/* ============================================================
   Judging + feedback copy
   ============================================================ */
const PRAISE_HIGH = ["Beautiful.", "That's the one.", "Perfect balance.", "Lovely stroke."];
const PRAISE_MID  = ["Nice.", "Good.", "Yes — that's it.", "Clean.", "Well placed."];
const MISS = {
  back : "That one runs the other way — begin at the red dot.",
  shape: "That isn't the shape of this stroke — follow the blue line.",
  place: "Right idea, wrong place — line it up with the blue stroke.",
  short: "Carry it all the way to the end of the stroke.",
  long : "That ran well past the end — stop where the blue line stops.",
  hook : "Almost — this one finishes with a hook (はね).",
  close: "So close. Try that stroke once more."
};
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

function say(text, mood, chipText){
  elFb.className = "fb" + (mood ? " " + mood : "");
  elFbTxt.textContent = text;
  if (chipText === undefined || chipText === null) elChip.classList.remove("show");
  else { elChip.textContent = chipText; elChip.classList.add("show"); }
}
function buzz(p){ if (navigator.vibrate){ try { navigator.vibrate(p); } catch(e){} } }

function cancelHelp(){ if (helpTimer){ clearTimeout(helpTimer); helpTimer = 0; } }

function commit(cssPts){
  const u109 = cssPts.map(p => ({x:p.x/sc, y:p.y/sc}));

  if (mode === "memory"){
    const ref = strokes[Math.min(step, strokes.length-1)];
    const res = step < strokes.length ? judge(u109, ref, 1.35) : null;
    userInk.push(u109);
    recs[step] = res
      ? {score:res.score, tries:1, hint:hinted, reason:res.reason}
      : {score:0, tries:1, hint:false, reason:"extra", extra:true};
    step++;
    hinted = false;
    say(step === 1 ? "Keep going — check when you're finished." : "Stroke captured.", "", null);
    markBase(); syncUI(); requestPaint();
    return;
  }

  /* ---- trace mode: judge, accept or refuse ---- */
  const ref = strokes[step];
  if (!ref) return;
  const res = judge(u109, ref, 1);
  const prev = recs[step] || {tries:0};

  if (res.pass){
    recs[step] = {score:res.score, tries:prev.tries + 1, hint:hinted, reason:"ok"};
    userInk[step] = u109;
    settle = {pts:cssPts, t0:performance.now()};
    step++; misses = 0; hinted = false;
    if (step >= strokes.length){
      finishCharacter();
    } else {
      say(res.score >= 88 ? pick(PRAISE_HIGH) : pick(PRAISE_MID), "good", res.score + "%");
    }
  } else {
    recs[step] = {score:prev.score || 0, tries:prev.tries + 1, hint:hinted, reason:res.reason};
    misses++;
    say(misses >= 2 ? "Let me show you." : (MISS[res.reason] || MISS.close), "bad", res.score + "%");
    cv.classList.remove("nudge"); void cv.offsetWidth; cv.classList.add("nudge");
    buzz(12);
    if (misses >= 2){
      misses = 0;
      cancelHelp();
      const forKanji = kIndex, forStep = step, forMode = mode;
      helpTimer = setTimeout(() => {
        helpTimer = 0;
        if (kIndex !== forKanji || step !== forStep || mode !== forMode || phase !== "draw") return;
        if (live) return;                       // never steal ink from under a finger
        showMe(true);
      }, 420);
    }
  }
  markBase(); syncUI(); requestPaint();
}

/* ============================================================
   Grading a whole character
   ============================================================ */
function gradeLabel(v){
  if (v >= 92) return {k:"s", jp:"見事", en:"Excellent"};
  if (v >= 80) return {k:"a", jp:"良い", en:"Good"};
  if (v >= 66) return {k:"b", jp:"合格", en:"Pass"};
  return {k:"c", jp:"もう一度", en:"Try again"};
}

function computeGrade(){
  const M = strokes.length;
  const finals = [];
  let retries = 0, hints = 0, missing = 0;
  for (let i=0;i<M;i++){
    const r = recs[i];
    // Never drawn (or drawn as a stray) => a real zero in the mean, not a gap.
    if (!r || r.extra || r.score === undefined){
      finals.push(0); missing++;
      if (r) recs[i] = Object.assign({}, r, {final:0});
      continue;
    }
    const extraTries = Math.max(0, (r.tries||1) - 1);
    retries += extraTries;
    if (r.hint) hints++;
    // failures are NOT invisible: every retry and every hint costs.
    const v = Math.max(0, (r.score||0) - 11*extraTries - (r.hint ? 10 : 0));
    finals.push(v);
    recs[i] = Object.assign({}, r, {final:v});
  }
  const extra = Math.max(0, userInk.length - M);
  const mean = finals.reduce((a,b)=>a+b,0) / Math.max(1, M);
  const worst = finals.length ? Math.min.apply(null, finals) : 0;
  // "a character is only as good as its worst line" — worth a real 28%
  let total = 0.72*mean + 0.28*worst;
  total -= extra * Math.min(30, 55/Math.max(1,M) * 1.6);
  // Hints are metered per stroke (above) AND per character: one peek on a hard
  // stroke barely dents the grade, but tracing the whole thing off the hint
  // is not recall and must not read as recall.
  if (mode === "memory" && hints > 0) total -= 22 * (hints / Math.max(1, M));
  total = Math.round(clamp(total, 0, 100));

  // stroke-order diagnosis (never double-penalised: in-order scoring already
  // punishes it — this only names the mistake)
  let outOfOrder = 0;
  if (mode === "memory" && userInk.length){
    const used = new Set();
    for (let j=0;j<userInk.length;j++){
      let bestI = -1, bestA = Infinity;
      for (let i=0;i<M;i++){
        if (used.has(i)) continue;
        const a = affinity(userInk[j], strokes[i]);
        if (a < bestA){ bestA = a; bestI = i; }
      }
      if (bestI >= 0 && bestA < 22){ used.add(bestI); if (bestI !== j) outOfOrder++; }
    }
  }
  return {total:total, label:gradeLabel(total), finals:finals, worst:worst,
          retries:retries, hints:hints, missing:missing, extra:extra, outOfOrder:outOfOrder};
}

function finishCharacter(){
  cancelHelp();
  live = null; anim = null;
  phase = "result";
  doneAt = performance.now();
  result = computeGrade();
  sessionScores.push(result.total);

  const k = KANJI[kIndex];
  const g = result.label;
  let note;
  if (result.missing > 0 && mode === "memory")
    note = result.missing + (result.missing === 1 ? " stroke was missing" : " strokes were missing") + " — red shows what to work on.";
  else if (result.extra > 0)
    note = result.extra + (result.extra === 1 ? " extra stroke" : " extra strokes") + " — red shows what to work on.";
  else if (result.outOfOrder > 0)
    note = result.outOfOrder + " stroke" + (result.outOfOrder === 1 ? "" : "s") + " drawn out of order.";
  // Name the thing that actually cost the marks, so the grade and the stat
  // beside it can never contradict each other.
  else if (result.hints > 0 && result.hints * 2 >= strokes.length)
    note = "Hints on " + result.hints + " of " + strokes.length + " strokes — that's tracing, not recall.";
  else if (result.retries > 0 || result.hints > 0)
    note = [result.retries ? result.retries + " retr" + (result.retries === 1 ? "y" : "ies") : "",
            result.hints ? result.hints + " hint" + (result.hints === 1 ? "" : "s") : ""]
           .filter(Boolean).join(" · ") + " · weakest stroke " + result.worst + "%.";
  else if (result.total >= 92)
    note = DATA.meanings[k] + " — written cleanly, first time.";
  else
    note = "Weakest stroke " + result.worst + "%. Tap a tile to see it drawn.";

  say(g.jp + " · " + g.en + " — " + note, "done", null);
  buzz(result.total >= 66 ? 14 : [10,60,10]);
  markBase(); syncUI(); requestPaint();
}

/* ============================================================
   Actions
   ============================================================ */
function animList(list, numbers){
  if (!list.length) return;
  const budget = Math.min(4600, 520 + list.length*420);
  const lens = list.map(i => Math.max(6, strokes[i].len));
  const totalLen = lens.reduce((a,b)=>a+b,0) || 1;
  const dur = lens.map(L => clamp(budget * (L/totalLen), 260, 1500));
  anim = {list:list, k:0, t0:performance.now(), dur:dur, gap: list.length > 1 ? 130 : 400, numbers:!!numbers};
  requestPaint();
}

function showMe(auto){
  if (phase === "result"){
    animList(strokes.map((_,i)=>i), true);
    say("Stroke order, from the start.", "", null);
    syncUI();
    return;
  }
  if (live) return;
  const i = mode === "trace" ? step : Math.min(step, strokes.length-1);
  if (i >= strokes.length) return;
  hinted = true;
  if (recs[i]) recs[i].hint = true;
  animList([i], mode === "memory");
  say(auto ? "Watch the head of the brush." : (mode === "memory" ? "Hint — this costs a little." : "Watch the head of the brush."), "", null);
  syncUI();
}

function previewStroke(i){
  if (i < 0 || i >= strokes.length) return;
  if (live) return;
  animList([i], true);
  const r = recs[i];
  say("Stroke " + (i+1) + (r && r.final !== undefined ? " — you scored " + r.final + "%" : ""), "", null);
}

function undo(){
  cancelHelp();
  if (phase === "result"){ retry(); return; }
  if (mode === "trace"){
    if (step === 0) return;
    step--; recs[step] = null; userInk[step] = null;
  } else {
    if (!userInk.length) return;
    userInk.pop(); recs.pop(); step = userInk.length;
  }
  misses = 0; hinted = false; settle = null; anim = null;
  say("Undone — stroke " + (step+1) + " again.", "", null);
  markBase(); syncUI(); requestPaint();
}

function retry(){
  cancelHelp();
  phase = "draw"; step = 0; recs = []; userInk = []; misses = 0; hinted = false;
  live = null; settle = null; anim = null; doneAt = 0; result = null;
  say(mode === "trace" ? "Trace the blue stroke — start at the red dot."
                       : "Write it from memory, then tap Check.", "", null);
  markBase(); syncUI(); requestPaint();
}
function clearAll(){ retry(); }

function checkMemory(){
  if (!userInk.length){
    say("Draw the character first, then tap Check.", "bad", null);
    return;
  }
  finishCharacter();
}

function loadKanji(i){
  cancelHelp();
  kIndex = ((i % KANJI.length) + KANJI.length) % KANJI.length;
  const k = KANJI[kIndex];
  strokes = strokesFor(k);
  phase = "draw"; step = 0; recs = []; userInk = []; misses = 0; hinted = false;
  live = null; settle = null; anim = null; doneAt = 0; result = null; activeId = null;
  elGlyph.textContent = mode === "memory" ? "？" : k;
  elMean.textContent = DATA.meanings[k];
  elRead.textContent = DATA.readings[k];
  elCnt.textContent = (kIndex+1) + "/" + KANJI.length;
  buildRail();
  elRail.scrollLeft = 0;
  say(mode === "trace" ? "Trace the blue stroke — start at the red dot."
                       : "Write “" + DATA.meanings[k] + "” from memory, then tap Check.", "", null);
  markBase(); syncUI(); requestPaint();
}

function setMode(m){
  if (m === mode) return;
  mode = m;
  btnTrace.setAttribute("aria-pressed", String(m === "trace"));
  btnMem.setAttribute("aria-pressed", String(m === "memory"));
  loadKanji(kIndex);
}

/* ============================================================
   UI sync
   ============================================================ */
function buildRail(){
  let html = "";
  for (let i=0;i<strokes.length;i++){
    let paths = "";
    for (let j=0;j<=i;j++) paths += '<path class="' + (j===i?"hi":"") + '" d="' + strokes[j].d + '"/>';
    html += '<button class="tile" type="button" role="listitem" data-i="' + i +
            '" aria-label="Show stroke ' + (i+1) + '"><svg viewBox="0 0 ' + VB + ' ' + VB +
            '" aria-hidden="true">' + paths + '</svg><span class="pct" hidden></span></button>';
  }
  elRail.innerHTML = html;
}

function buildPips(){
  if (!userInk.length){ elPips.innerHTML = '<span class="lbl">Nothing drawn yet</span>'; return; }
  let html = '<span class="lbl">Strokes drawn</span>';
  for (let i=0;i<userInk.length;i++) html += '<span class="pip on"></span>';
  elPips.innerHTML = html;
}

function syncUI(){
  const M = strokes.length;
  const memDraw = (mode === "memory" && phase === "draw");

  // progress — Memory mode does not leak the stroke count before Check
  if (phase === "result"){
    elPtxt.innerHTML = "All <b>" + M + "</b> strokes · <span class=\"gradebadge " + result.label.k + "\">" +
                       result.label.jp + " " + result.label.en + "</span>";
    elAcc.innerHTML = "<b>" + result.total + "%</b>";
  } else if (memDraw){
    elPtxt.innerHTML = "From memory · <b>" + userInk.length + "</b> stroke" + (userInk.length === 1 ? "" : "s") + " drawn";
    elAcc.innerHTML = sessionScores.length
      ? "session <b>" + Math.round(sessionScores.reduce((a,b)=>a+b,0)/sessionScores.length) + "%</b>" : "";
  } else {
    elPtxt.innerHTML = "Stroke <b>" + Math.min(step+1, M) + "</b> of " + M;
    const done = recs.filter(r => r && r.reason === "ok");
    elAcc.innerHTML = done.length
      ? "so far <b>" + Math.round(done.reduce((a,r)=>a+Math.max(0,(r.score||0)-11*Math.max(0,(r.tries||1)-1)),0)/done.length) + "%</b>"
      : "";
  }

  // rail vs pips
  if (memDraw){
    elRail.classList.add("hidden"); elPips.classList.remove("hidden"); buildPips();
  } else {
    elPips.classList.add("hidden"); elRail.classList.remove("hidden");
    const tiles = elRail.children;
    for (let i=0;i<tiles.length;i++){
      const tile = tiles[i];
      const r = recs[i];
      let cls = "tile";
      if (phase === "result"){
        const v = r && r.final !== undefined ? r.final : 0;
        const b = bandOf(v);
        cls += " done " + (b === "good" ? "g-good" : b === "fair" ? "g-mid" : "g-bad");
      } else {
        cls += i < step ? " done" : (i === step ? " cur" : "");
      }
      tile.className = cls;
      const pct = tile.querySelector(".pct");
      if (pct){
        if (phase === "result"){ pct.hidden = false; pct.textContent = (r && r.final !== undefined ? r.final : 0); }
        else pct.hidden = true;
      }
    }
    // scroll the active tile into view without touching ancestor scroll
    const active = tiles[Math.min(step, tiles.length-1)];
    if (active){
      const want = active.offsetLeft - (elRail.clientWidth - active.offsetWidth)/2;
      const max = Math.max(0, elRail.scrollWidth - elRail.clientWidth);
      elRail.scrollLeft = clamp(want, 0, max);
    }
  }

  // buttons
  btnUndo.disabled = phase === "result" ? false : (mode === "trace" ? step === 0 : userInk.length === 0);
  undoIc.textContent  = phase === "result" ? "↻" : "↺";
  undoLbl.textContent = phase === "result" ? "Again" : "Undo";
  btnUndo.setAttribute("aria-label", phase === "result" ? "Write this kanji again" : "Undo last stroke");
  btnClear.disabled = phase !== "result" && step === 0 && !userInk.length;
  btnShow.disabled = phase === "draw" && mode === "trace" && step >= M;
  lblShow.textContent = phase === "result" ? "Replay" : (mode === "memory" ? "Hint" : "Show me");

  btnMain.classList.remove("ready","check");
  const role = phase === "result" ? "next" : (mode === "memory" ? "check" : "next");
  if (phase === "result"){ btnMain.textContent = "Next kanji →"; btnMain.classList.add("ready"); }
  else if (mode === "memory"){ btnMain.textContent = "Check"; btnMain.classList.add("check"); }
  else { btnMain.textContent = "Next kanji"; }
  if (role !== mainRole){ mainRole = role; roleChangedAt = performance.now(); }

  elGlyph.textContent = (mode === "memory" && phase === "draw") ? "？" : KANJI[kIndex];
}

/* ============================================================
   Wiring
   ============================================================ */
btnUndo.addEventListener("click", undo);
btnClear.addEventListener("click", clearAll);
btnShow.addEventListener("click", () => showMe(false));
btnPrev.addEventListener("click", () => loadKanji(kIndex-1));
btnTrace.addEventListener("click", () => setMode("trace"));
btnMem.addEventListener("click", () => setMode("memory"));

/* The primary button changes job (Check -> Next kanji), so a fast double tap
   must not run Check and then immediately skip past the result it produced.
   Only clicks that land within 400ms of a ROLE CHANGE are swallowed — two
   deliberate taps on the same job still both count. */
btnMain.addEventListener("click", () => {
  if (performance.now() - roleChangedAt < 400) return;
  if (phase === "result") loadKanji(kIndex+1);
  else if (mode === "memory") checkMemory();
  else loadKanji(kIndex+1);
});

elRail.addEventListener("click", e => {
  const tile = e.target.closest ? e.target.closest(".tile") : null;
  if (!tile) return;
  const i = parseInt(tile.getAttribute("data-i"), 10);
  if (!isNaN(i)) previewStroke(i);
});

btnTheme.addEventListener("click", () => {
  const root = document.documentElement;
  const cur = root.getAttribute("data-theme");
  const next = cur === "light" ? "dark" : (cur === "dark" ? "" : "light");
  if (next) root.setAttribute("data-theme", next); else root.removeAttribute("data-theme");
  readPalette(); markBase(); requestPaint();
  btnTheme.setAttribute("aria-label", "Theme: " + (next || "automatic"));
});

document.addEventListener("keydown", e => {
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === "ArrowRight"){ loadKanji(kIndex+1); }
  else if (e.key === "ArrowLeft"){ loadKanji(kIndex-1); }
  else if (e.key === " "){ e.preventDefault(); showMe(false); }
  else if (e.key === "Backspace"){ e.preventDefault(); undo(); }
  else if (e.key === "Enter"){ e.preventDefault(); btnMain.click(); }
  else if (e.key.toLowerCase() === "m"){ setMode(mode === "trace" ? "memory" : "trace"); }
});

if (window.matchMedia){
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  const onScheme = () => { readPalette(); markBase(); requestPaint(); };
  if (mq.addEventListener) mq.addEventListener("change", onScheme);
  else if (mq.addListener) mq.addListener(onScheme);
}

/* ============================================================
   Boot — size first, then load, so the first frame is correct
   ============================================================ */
readPalette();
resize();
loadKanji(0);
resize();
requestPaint();

/* Integration surface for the host study app. */
window.KotobaKanji = {
  version: "1.0",
  kanji: KANJI,
  load: function(x){
    const i = typeof x === "number" ? x : KANJI.indexOf(x);
    if (i < 0) return false;                 // no silent wrong-kanji fallback
    loadKanji(i); return true;
  },
  setMode: setMode,
  state: function(){
    return {kanji:KANJI[kIndex], mode:mode, phase:phase, stroke:step,
            strokes:strokes.length, result:result ? Object.assign({}, result) : null,
            session:sessionScores.slice()};
  },
  judge: function(pts109, kanji, strokeIndex, tol){
    const list = strokesFor(kanji);
    if (!list[strokeIndex]) return null;
    return judge(pts109, list[strokeIndex], tol);
  },
  strokesFor: strokesFor,
  reset: function(){ sessionScores = []; loadKanji(kIndex); }
};

/* grade picker + shuffle */
(function(){
  var sel = document.getElementById('gradeSel');
  var counts = {}; ALLK.forEach(function(k){ var g = DATA.grades[k]; counts[g] = (counts[g]||0)+1; });
  var NAMES = {1:'Hiragana', 2:'Hiragana \u309b\u309c', 3:'Katakana', 4:'Katakana \u309b\u309c'};
  var o = '<option value="1">Hiragana ('+(counts[1]||0)+')</option>';
  for (var g = 2; g <= 4; g++) o += '<option value="'+g+'">'+NAMES[g]+' ('+(counts[g]||0)+')</option>';
  o += '<option value="0">Everything ('+ALLK.length+')</option>';
  sel.innerHTML = o;
  sel.onchange = function(){
    var g = +sel.value;
    KANJI = g ? ALLK.filter(function(k){ return DATA.grades[k] === g; }) : ALLK.slice();
    sessionScores = []; loadKanji(0);
  };
  document.getElementById('shufBtn').onclick = function(){
    for (var i = KANJI.length - 1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = KANJI[i]; KANJI[i] = KANJI[j]; KANJI[j] = t; }
    loadKanji(0);
  };
})();
</script>

<script>
/* pull-to-refresh: drag down from the very top to reload fresh (clears app caches first) */
(function(){
  if(!('ontouchstart' in window))return;
  var THRESH=85, startY=0, dy=0, armed=false, busy=false;
  var el=document.createElement('div');
  el.setAttribute('style','position:fixed;top:-64px;left:50%;transform:translateX(-50%);z-index:9999;'+
    'display:flex;align-items:center;gap:8px;min-height:44px;padding:10px 20px;border-radius:999px;'+
    'background:rgba(31,35,40,.88);color:#fffdf7;font:600 15px -apple-system,BlinkMacSystemFont,sans-serif;'+
    'box-shadow:0 4px 14px rgba(0,0,0,.3);transition:top .18s;pointer-events:none');
  el.innerHTML='<span data-ptr-ic style="font-size:18px">&#8595;</span><span data-ptr-tx>Pull to refresh</span>';
  document.body.appendChild(el);
  var ic=el.querySelector('[data-ptr-ic]'), tx=el.querySelector('[data-ptr-tx]');
  function scrolled(t){ while(t&&t!==document.body){ if(t.scrollTop>0)return true; t=t.parentElement; } return false; }
  document.addEventListener('touchstart',function(e){
    if(busy||e.touches.length!==1)return;
    var t=e.target;
    if(t&&t.tagName==='CANVAS')return;               /* never fight the drawing pad */
    if((window.scrollY||document.documentElement.scrollTop||0)>0)return;
    if(scrolled(t))return;
    armed=true;startY=e.touches[0].clientY;dy=0;
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!armed||busy)return;
    dy=e.touches[0].clientY-startY;
    if(dy<=8){el.style.top='-64px';return;}
    el.style.top=(Math.min(dy*0.45,80)-52)+'px';
    tx.textContent = dy>THRESH ? 'Release to refresh' : 'Pull to refresh';
    ic.innerHTML  = dy>THRESH ? '&#8635;' : '&#8595;';
  },{passive:true});
  document.addEventListener('touchend',function(){
    if(!armed||busy)return;
    armed=false;
    if(dy>THRESH){
      busy=true; el.style.top='14px'; ic.innerHTML='&#8987;'; tx.textContent='Refreshing\u2026';
      (async function(){
        try{ if(navigator.serviceWorker){ var rs=await navigator.serviceWorker.getRegistrations(); for(var i=0;i<rs.length;i++){ try{await rs[i].update();}catch(e){} } } }catch(e){}
        try{ if(window.caches){ var ks=await caches.keys(); for(var j=0;j<ks.length;j++){ try{await caches.delete(ks[j]);}catch(e){} } } }catch(e){}
        location.reload();
      })();
    } else { el.style.top='-64px'; }
  },{passive:true});
})();
</script>
