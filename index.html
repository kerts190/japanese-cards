<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Japanese Cards">
<meta name="theme-color" content="#1f3a5f">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231f3a5f'/%3E%3Ctext x='90' y='122' font-size='96' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E&#12354;%3C/text%3E%3C/svg%3E">
<title>Japanese Cards</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;background:#e9e6dc;color:#2c2a26;
    display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;}
  header{background:#1f3a5f;color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;flex:none;}
  .hrow{display:flex;align-items:center;gap:10px;}
  .hrow h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.5px;flex:1;}
  select{font-size:15px;padding:7px 8px;border-radius:9px;border:none;background:#fff;max-width:48%;}
  .tabs{display:flex;gap:8px;margin-top:10px;}
  .tab{flex:1;text-align:center;padding:9px 0;border-radius:10px;background:#33507a;color:#cdd7e6;
    font-size:15px;font-weight:600;cursor:pointer;border:none;}
  .tab.on{background:#fff;color:#1f3a5f;}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;min-height:0;}
  /* CARD */
  .card{width:100%;max-width:440px;height:100%;max-height:620px;background:#fffdf7;border:1px solid #d9d3c2;
    border-radius:20px;box-shadow:0 8px 26px rgba(0,0,0,.16);display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:18px;position:relative;overflow:hidden;cursor:pointer;user-select:none;}
  .pic{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;min-height:0;}
  .pic svg{width:74%;max-width:300px;height:auto;max-height:44vh;}
  .wbig{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Hiragino Sans",sans-serif;font-weight:800;
    font-size:54px;margin-top:14px;line-height:1;text-align:center;}
  .rsmall{font-style:italic;color:#9a8f76;font-size:22px;margin-top:8px;}
  .secbadge{position:absolute;top:12px;left:14px;font-size:12px;color:#b3aa92;font-style:italic;}
  .flliphint{position:absolute;bottom:10px;font-size:12px;color:#c3bba6;letter-spacing:.5px;}
  /* BACK */
  .back{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%;flex:1;}
  .card.flipped .pic{display:none;}
  .card.flipped .back{display:flex;}
  .bhira{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:60px;line-height:1;}
  .brom{color:#c0392b;font-style:italic;font-size:26px;margin-top:6px;}
  .bdef{font-size:30px;margin-top:18px;font-weight:600;padding:0 6px;}
  .bex{margin-top:22px;padding-top:16px;border-top:1px dashed #ddd4bf;width:90%;}
  .bex .jp{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:25px;line-height:1.35;}
  .bex .ro{font-style:italic;color:#8a8472;font-size:17px;margin-top:6px;}
  .bex .en{font-size:19px;color:#4a463d;margin-top:7px;}
  .bex .hl{color:#c0392b;font-weight:700;}
  /* NAV */
  .nav{display:flex;align-items:center;gap:16px;margin-top:12px;flex:none;}
  .nav button{width:58px;height:58px;border-radius:50%;border:none;background:#1f3a5f;color:#fff;font-size:24px;cursor:pointer;}
  .nav button:active{transform:scale(.94);}
  .counter{font-size:15px;color:#6b6450;min-width:74px;text-align:center;}
  /* QUIZ */
  .quizwrap{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;height:100%;}
  .qcard{background:#fffdf7;border:1px solid #d9d3c2;border-radius:20px;box-shadow:0 8px 26px rgba(0,0,0,.16);
    width:100%;padding:18px;display:flex;flex-direction:column;align-items:center;flex:none;}
  .qcard svg{width:46%;max-width:170px;max-height:24vh;height:auto;}
  .qhira{font-family:"Hiragino Mincho ProN",serif;font-size:50px;margin-top:6px;line-height:1;}
  .qprompt{font-size:15px;color:#8a8472;margin-top:8px;}
  .opts{width:100%;max-width:440px;margin-top:14px;display:flex;flex-direction:column;gap:10px;}
  .opt{padding:15px 14px;border-radius:13px;border:2px solid #d9d3c2;background:#fff;font-size:18px;
    text-align:center;cursor:pointer;font-weight:600;color:#2c2a26;}
  .opt.correct{background:#dff3e0;border-color:#5aa469;color:#2f7a43;}
  .opt.wrong{background:#fbe3e0;border-color:#d98b82;color:#b03a2c;}
  .opt:disabled{cursor:default;}
  .qbar{display:flex;width:100%;max-width:440px;align-items:center;margin-top:14px;gap:12px;}
  .score{font-size:16px;color:#1f3a5f;font-weight:700;flex:1;}
  .qnext{padding:12px 22px;border-radius:12px;border:none;background:#c9a227;color:#fff;font-size:17px;font-weight:700;cursor:pointer;}
  .qnext:disabled{opacity:.35;}
</style>
</head>
<body>

  <div class="hrow">
    <h1>Japanese Cards</h1>
    <select id="sec"></select>
  </div>

    <button class="tab on" data-m="browse">Browse</button>
    <button class="tab" data-m="shuffle">Shuffle</button>
    <button class="tab" data-m="quiz">Quiz</button>
  </div>
</header>
<main id="main"></main>

 width=\"14\" height=\"33\" fill=\"#3a5e8a\"/><circle cx=\"246\" cy=\"140\" r=\"4\" fill=\"#fff6cf\" stroke=\"#caa12a\" stroke-width=\"1\"/>\n      </svg>", "word": "モノレール", "hira": "モノレール", "romaji": "monoreeru", "def": "monorail", "exjp": "<span class=\"hl\">モノレール</span> に のります。", "exro": "<span style=\"color:#c0392b; font-style:italic;\">Monoreeru</span> ni norimasu.", "exen": "“I ride the <span style=\"color:#c0392b; font-style:italic; font-family:'Georgia','Times New Roman',serif;\">monorail</span>.”"}, {"sec": 18, "topic": "Travel & Trips", "svg": "<svg viewBox=\"0 0 300 300\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"0\" y=\"60\" width=\"300\" height=\"160\" fill=\"#dceef5\"/><ellipse cx=\"150\" cy=\"216\" rx=\"120\" ry=\"16\" fill=\"#fff\"/><circle cx=\"150\" cy=\"186\" r=\"34\" fill=\"#fff\" stroke=\"#d6e2ea\" stroke-width=\"2\"/><circle cx=\"150\" cy=\"140\" r=\"26\" fill=\"#fff\" stroke=\"#d6e2ea\" stroke-width=\"2\"/><circle cx=\"142\" cy=\"136\" r=\"2.6\" fill=\"#2c2a26\"/><circle cx=\"158\" cy=\"136\" r=\"2.6\" fill=\"#2c2a26\"/><path d=\"M150 142 l8 4 l-8 3 Z\" fill=\"#e8772e\"/><g fill=\"#2c2a26\"><circle cx=\"150\" cy=\"180\" r=\"2.4\"/><circle cx=\"150\" cy=\"190\" r=\"2.4\"/><circle cx=\"150\" cy=\"200\" r=\"2.4\"/></g><path d=\"M124 150 L100 138 M176 150 L200 138\" stroke=\"#9c6b3f\" stroke-width=\"3\" stroke-linecap=\"round\"/><g><circle cx=\"30\" cy=\"87\" r=\"2.5\" fill=\"#ffffff\"/><circle cx=\"267\" cy=\"119\" r=\"3\" fill=\"#cfe6f2\"/><circle cx=\"23\" cy=\"183\" r=\"3\" fill=\"#dff0f8\"/><circle cx=\"207\" cy=\"192\" r=\"3.5\" fill=\"#ffffff\"/><circle cx=\"214\" cy=\"88\" r=\"3\" fill=\"#ffffff\"/><circle cx=\"18\" cy=\"134\" r=\"3.5\" fill=\"#dff0f8\"/><circle cx=\"250\" cy=\"163\" r=\"4\" fill=\"#ffffff\"/><circle cx=\"140\" cy=\"90\" r=\"2\" fill=\"#dff0f8\"/><circle cx=\"201\" cy=\"93\" r=\"4\" fill=\"#ffffff\"/><circle cx=\"272\" cy=\"119\" r=\"3.5\" fill=\"#ffffff\"/><circle cx=\"40\" cy=\"204\" r=\"2\" fill=\"#dff0f8\"/><circle cx=\"107\" cy=\"103\" r=\"3.5\" fill=\"#dff0f8\"/><circle cx=\"235\" cy=\"139\" r=\"3.5\" fill=\"#dff0f8\"/><circle cx=\"226\" cy=\"100\" r=\"2.5\" fill=\"#cfe6f2\"/><circle cx=\"57\" cy=\"202\" r=\"4\" fill=\"#dff0f8\"/><circle cx=\"190\" cy=\"192\" r=\"3.5\" fill=\"#cfe6f2\"/><circle cx=\"109\" cy=\"145\" r=\"2.5\" fill=\"#dff0f8\"/><circle cx=\"278\" cy=\"138\" r=\"3.5\" fill=\"#cfe6f2\"/><circle cx=\"44\" cy=\"195\" r=\"4\" fill=\"#cfe6f2\"/><circle cx=\"93\" cy=\"72\" r=\"2.5\" fill=\"#ffffff\"/><circle cx=\"161\" cy=\"95\" r=\"2\" fill=\"#dff0f8\"/><circle cx=\"183\" cy=\"109\" r=\"3.5\" fill=\"#dff0f8\"/><circle cx=\"126\" cy=\"101\" r=\"3\" fill=\"#cfe6f2\"/><circle cx=\"236\" cy=\"170\" r=\"3\" fill=\"#ffffff\"/><circle cx=\"43\" cy=\"139\" r=\"4\" fill=\"#ffffff\"/><circle cx=\"25\" cy=\"87\" r=\"4\" fill=\"#ffffff\"/><circle cx=\"274\" cy=\"200\" r=\"3\" fill=\"#ffffff\"/><circle cx=\"266\" cy=\"190\" r=\"4\" fill=\"#ffffff\"/><circle cx=\"40\" cy=\"114\" r=\"2\" fill=\"#ffffff\"/><circle cx=\"263\" cy=\"119\" r=\"2\" fill=\"#cfe6f2\"/><circle cx=\"24\" cy=\"110\" r=\"2.5\" fill=\"#dff0f8\"/><circle cx=\"228\" cy=\"179\" r=\"2\" fill=\"#ffffff\"/><circle cx=\"110\" cy=\"123\" r=\"3\" fill=\"#dff0f8\"/><circle cx=\"87\" cy=\"163\" r=\"2\" fill=\"#ffffff\"/><circle cx=\"239\" cy=\"98\" r=\"4\" fill=\"#dff0f8\"/><circle cx=\"271\" cy=\"89\" r=\"4\" fill=\"#dff0f8\"/><circle cx=\"209\" cy=\"158\" r=\"3\" fill=\"#ffffff\"/><circle cx=\"34\" cy=\"116\" r=\"2\" fill=\"#dff0f8\"/><circle cx=\"65\" cy=\"93\" r=\"2.5\" fill=\"#cfe6f2\"/></g>\n      </svg>", "word": "ゆき", "hira": "ゆき", "romaji": "yuki", "def": "snow", "exjp": "<span class=\"hl\">ゆき</span> が ふります。", "exro": "<span style=\"color:#c0392b; font-style:italic;\">Yuki</span> ga furimasu.", "exen": "“<span style=\"color:#c0392b; font-style:italic; font-family:'Georgia','Times New Roman',serif;\">Snow</span> falls.”"}, {"sec": 18, "topic": "Travel & Trips", "svg": "<svg viewBox=\"0 0 300 300\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"80\" y=\"100\" width=\"140\" height=\"116\" rx=\"12\" fill=\"#fff\" stroke=\"#c9bda0\" stroke-width=\"2\"/><rect x=\"80\" y=\"100\" width=\"140\" height=\"8\" rx=\"4\" fill=\"#9b59b6\"/><circle cx=\"150\" cy=\"150\" r=\"38\" fill=\"#9b59b6\"/><text x=\"150\" y=\"164\" text-anchor=\"middle\" font-family=\"Helvetica Neue, Arial, sans-serif\" font-weight=\"800\" font-size=\"44\" fill=\"#fff\">4</text><text x=\"150\" y=\"212\" text-anchor=\"middle\" font-family=\"'Hiragino Kaku Gothic ProN',sans-serif\" font-weight=\"700\" font-size=\"18\" fill=\"#7a6f58\">&#26085;&#30446;</text>\n      </svg>", "word": "よっかめ", "hira": "よっかめ", "romaji": "yokkame", "def": "the fourth day", "exjp": "<span class=\"hl\">よっかめ</span> は とうきょう です。", "exro": "<span style=\"color:#c0392b; font-style:italic;\">Yokkame</span> wa Tookyoo desu.", "exen": "“The <span style=\"color:#c0392b; font-style:italic; font-family:'Georgia','Times New Roman',serif;\">fourth day</span> is Tokyo.”"}]</script>
<script>
const ALL = JSON.parse(document.getElementById('cards').textContent);
const main = document.getElementById('main');
const secSel = document.getElementById('sec');
let mode='browse', deck=[], pos=0, score=0, asked=0;

// section dropdown
(function(){
  let o='<option value="0">All sections ('+ALL.length+')</option>';
  const secs=[...new Set(ALL.map(c=>c.sec))].sort((a,b)=>a-b);
  secs.forEach(s=>{const t=ALL.find(c=>c.sec===s).topic;const n=ALL.filter(c=>c.sec===s).length;
    o+='<option value="'+s+'">'+s+'. '+t+' ('+n+')</option>';});
  secSel.innerHTML=o;
})();

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pool(){const s=+secSel.value;return s===0?ALL.slice():ALL.filter(c=>c.sec===s);}

function buildDeck(){
  deck=pool();
  if(mode==='shuffle'||mode==='quiz') shuffle(deck);
  pos=0;
}

function render(){
  if(mode==='quiz'){renderQuiz();return;}
  const c=deck[pos];
  main.innerHTML=
    '<div class="card" id="cardEl">'+
      '<div class="secbadge">Section '+c.sec+'</div>'+
      '<div class="pic">'+c.svg+'<div class="wbig">'+c.hira+'</div>'+
        (c.romaji?'<div class="rsmall">'+c.romaji+'</div>':'')+'</div>'+
      '<div class="back">'+
        '<div class="bhira">'+c.hira+'</div>'+
        (c.romaji?'<div class="brom">'+c.romaji+'</div>':'')+
        '<div class="bdef">'+c.def+'</div>'+
        (c.exjp?'<div class="bex"><div class="jp">'+c.exjp+'</div><div class="ro">'+c.exro+'</div><div class="en">'+c.exen+'</div></div>':'')+
      '</div>'+
      '<div class="flliphint">tap to flip</div>'+
    '</div>'+
    '<div class="nav">'+
      '<button id="prev">&#8249;</button>'+
      '<div class="counter">'+(pos+1)+' / '+deck.length+'</div>'+
      '<button id="next">&#8250;</button>'+
    '</div>';
  const card=document.getElementById('cardEl');
  document.getElementById('prev').onclick=e=>{e.stopPropagation();go(-1);};
  document.getElementById('next').onclick=e=>{e.stopPropagation();go(1);};
  // swipe + tap
  let sx=0,sy=0,moved=false;
  card.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;moved=false;});
  card.addEventListener('pointerup',e=>{
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){go(dx<0?1:-1);}
    else if(Math.abs(dx)<12&&Math.abs(dy)<12){card.classList.toggle('flipped');}
  });
}
function go(d){pos=(pos+d+deck.length)%deck.length;render();}

// QUIZ
function renderQuiz(){
  if(asked>=deck.length){
    main.innerHTML='<div class="quizwrap" style="justify-content:center"><div class="qcard">'+
      '<div class="qhira" style="font-size:34px">Quiz complete!</div>'+
      '<div class="bdef">You scored '+score+' / '+asked+'</div>'+
      '<button class="qnext" style="margin-top:18px" id="again">Play again</button></div></div>';
    document.getElementById('again').onclick=()=>{startQuiz();};
    return;
  }
  const c=deck[pos];
  // 4 options: correct + 3 distractors (distinct readings). Options show ROMAJI;
  // they flip to the English meaning once an answer is tapped.
  let others=pool().filter(x=>x.romaji!==c.romaji);
  shuffle(others);
  let opts=[c, ...others.slice(0,3)];
  shuffle(opts);
  main.innerHTML='<div class="quizwrap">'+
    '<div class="qcard">'+c.svg+'<div class="qhira">'+c.hira+'</div>'+
      '<div class="qprompt">Tap the correct reading</div></div>'+
    '<div class="opts" id="opts">'+
      opts.map((o,i)=>'<button class="opt" data-i="'+i+'" data-ok="'+(o.romaji===c.romaji?1:0)+'">'+o.romaji+'</button>').join('')+
    '</div>'+
    '<div class="qbar"><div class="score">Score '+score+' / '+asked+'</div>'+
      '<button class="qnext" id="qn" disabled>Next &#8250;</button></div>'+
  '</div>';
  asked++;
  const btns=[...document.querySelectorAll('.opt')];
  btns.forEach(b=>b.onclick=()=>{
    if(b.disabled)return;
    const ok=b.dataset.ok==='1';
    // lock all; flip EVERY option to its English meaning; mark the correct one green and a wrong pick red
    btns.forEach(x=>{x.disabled=true;x.textContent=opts[+x.dataset.i].def;if(x.dataset.ok==='1')x.classList.add('correct');});
    if(ok){score++;} else {b.classList.add('wrong');}
    document.querySelector('.score').textContent='Score '+score+' / '+asked;
    const qn=document.getElementById('qn');qn.disabled=false;
    qn.onclick=()=>{pos=(pos+1)%deck.length;renderQuiz();};
  });
}
function startQuiz(){buildDeck();score=0;asked=0;renderQuiz();}

// tabs + section change
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');mode=t.dataset.m;
  if(mode==='quiz')startQuiz(); else {buildDeck();render();}
});
secSel.onchange=()=>{ if(mode==='quiz')startQuiz(); else {buildDeck();render();} };

buildDeck();render();
</script>
</body>
